<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Urooj Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap"></noscript>
<style>
:root{--p:#1558D6;--navy:#0B1F4B;--grey:#55607E;--bg:#F6F8FD;--line:#DDE5F5;--red:#C2264B}
*{box-sizing:border-box}
body{margin:0;background:#E9EEF9;font-family:'Plus Jakarta Sans','Noto Sans Devanagari',system-ui,sans-serif;color:var(--navy)}
button{font-family:inherit;cursor:pointer}
#app{max-width:430px;min-height:100vh;margin:0 auto;background:var(--bg);position:relative;padding-bottom:84px}
.pad{padding:20px 18px}
.hd{display:flex;align-items:center;gap:8px}.hd>div[style*="flex:1"]{min-width:0}.bellcol{display:flex;flex-direction:column;align-items:center;gap:2px;flex:none}.bellcol .device-clock{height:22px;min-width:50px;padding:0 8px;border-radius:11px;box-shadow:none}.bellcol .ib{height:40px}
.logo{font-size:20px;font-weight:800;line-height:1.1}.logo b{color:var(--p)}
.tag{font-size:12px;color:var(--grey);margin-top:2px}
.ib{width:44px;height:44px;border:0;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.ib.n{background:none}
.ban{margin-top:18px;border-radius:20px;background:#E6EFFF;padding:18px}
.ban h1{margin:0;font-size:22px;line-height:1.25;font-weight:800}.ban h1 span{color:var(--p)}
.ban p{margin:8px 0 0;font-size:12px;color:#4A5675;line-height:1.5;max-width:75%}
.sr{margin-top:16px;height:48px;border-radius:16px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 14px}
.sr input{border:0;outline:0;flex:1;font:inherit;font-size:13px;background:none;color:var(--navy)}
h2{font-size:16px;font-weight:700;margin:22px 0 0}
.cats{display:flex;justify-content:space-between;margin-top:12px}
.cat{width:62px;text-align:center;border:0;background:none;padding:0;color:var(--navy);font-size:11.5px;font-weight:600}
.cat i{display:flex;width:52px;height:52px;margin:0 auto 6px;border-radius:16px;align-items:center;justify-content:center;border:2px solid transparent}
.cat.on i{border-color:currentColor}
.card{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;margin-top:10px}
.ci{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none}
.card .t{font-size:13px;font-weight:700}.card .s{font-size:12px;color:var(--grey);margin-top:2px}.card .m{font-size:11.5px;color:var(--grey);margin-top:5px}
.btn{flex:none;height:44px;padding:0 14px;border:0;border-radius:22px;background:var(--p);color:#fff;font-size:12px;font-weight:700}
.btn.o{background:#fff;color:var(--p);border:1.5px solid var(--p)}
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:76px;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;border:0;background:none;color:var(--grey);font-size:11px;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tabs button.on{color:var(--p);font-weight:700}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.timer{font-weight:800;color:var(--p);font-size:15px}.timer.low{color:var(--red)}
.q{font-size:18px;font-weight:700;line-height:1.45;margin:18px 0}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;text-align:left;padding:12px;margin-bottom:10px;border-radius:14px;border:1.5px solid var(--line);background:#fff;color:var(--navy);font-size:14px}
.opt.on{border-color:var(--p);background:#E6EFFF}
.opt u{width:20px;height:20px;border-radius:50%;border:2px solid var(--grey);flex:none;text-decoration:none}
.opt.on u{border:6px solid var(--p)}
.nav{display:flex;gap:10px;margin-top:24px}.nav .btn{flex:1;height:48px;border-radius:24px;font-size:14px}
.res{text-align:center;padding-top:70px}.big{font-size:60px;font-weight:800;color:var(--p)}
.bar{height:10px;border-radius:5px;background:var(--line);margin-top:6px}.bar div{height:10px;border-radius:5px;background:var(--p)}
.mut{color:var(--grey);font-size:13px;margin-top:12px}
.ov{position:fixed;top:0;bottom:0;left:50%;width:100%;max-width:430px;transform:translateX(-50%);overflow:hidden;pointer-events:none;z-index:20}
.ov.open{pointer-events:auto}
.sh{position:absolute;inset:0;background:rgba(11,31,75,.45);opacity:0;transition:opacity .25s}
.ov.open .sh{opacity:1}
.dr{position:absolute;top:0;bottom:0;left:0;width:290px;max-width:84%;background:#fff;transform:translateX(-100%);transition:transform .25s ease;display:flex;flex-direction:column;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom)}
.ov.open .dr{transform:none}
.dh{background:var(--p);color:#fff;padding:28px 20px 20px}
.av{width:56px;height:56px;border-radius:50%;background:#DCE8FF;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.dh .nm{font-size:17px;font-weight:800}.dh .sb{font-size:12px;opacity:.9;margin-top:2px}
.dm{padding:12px}
.dm .lb{font-size:12px;font-weight:700;color:var(--grey);margin:14px 10px 6px}
.it{display:flex;align-items:center;gap:14px;width:100%;min-height:48px;border:0;background:none;border-radius:14px;padding:0 12px;font-size:14px;font-weight:600;color:var(--navy);text-align:left}
.it.on{background:#E6EFFF;color:var(--p)}
.it .dot{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.df{margin-top:auto;padding:16px 22px;font-size:11px;color:var(--grey);border-top:1px solid var(--line)}
.soon{text-align:center;padding:48px 20px}
.soon .em{font-size:56px;line-height:1}
.soon .h{font-size:20px;font-weight:800;margin-top:14px}
.soon .p{font-size:13px;color:var(--grey);margin-top:8px;line-height:1.5}
.pg h2{margin-top:0}.pg p{font-size:14px;line-height:1.7;color:#2B3858}
.subs{display:flex;gap:8px;margin-top:14px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;min-height:40px;padding:0 16px;border-radius:20px;border:1.5px solid var(--line);background:#fff;color:var(--navy);font-size:13px;font-weight:600}
.chip.on{background:var(--p);border-color:var(--p);color:#fff}
.board-switch{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.board-card{min-height:86px;border:1.5px solid var(--line);border-radius:18px;background:#fff;color:var(--navy);display:flex;align-items:center;gap:10px;padding:10px 12px;font:inherit;font-size:13px;font-weight:800;text-align:left}
.board-card.on{border-color:var(--p);background:#E6EFFF;color:var(--p);box-shadow:0 0 0 1px rgba(21,88,214,.08)}
.board-logo{width:54px;height:54px;border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;line-height:1}
.board-logo span{font-size:10px;font-weight:900;letter-spacing:.3px}
.board-logo small{font-size:6.5px;margin-top:5px;font-weight:700}
.rbse-logo{background:#FFF1D8;border:2px solid #C98B2E;color:#8A5A13}
.ncert-logo{background:#E8F1FF;border:2px solid #1558D6;color:#1558D6}

.pic{display:flex;flex-direction:column;align-items:center;margin:8px 0 18px}
.pic .ph{width:104px;height:104px;border-radius:50%;background:#DCE8FF;display:flex;align-items:center;justify-content:center;overflow:hidden;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.pic img,.av img{width:100%;height:100%;object-fit:cover}
.pic label{margin-top:12px;min-height:44px;display:flex;align-items:center;padding:0 18px;border-radius:22px;border:1.5px solid var(--p);color:var(--p);font-size:13px;font-weight:700;cursor:pointer}
.fld{margin-bottom:14px}.fld label{display:block;font-size:12px;font-weight:700;color:var(--grey);margin-bottom:6px}
.fld input{width:100%;height:48px;border-radius:14px;border:1.5px solid var(--line);background:#fff;padding:0 14px;font:inherit;font-size:14px;color:var(--navy)}
.fld input:focus{outline:0;border-color:var(--p)}
.err{color:var(--red);font-size:12px;margin-top:4px}
.ok{color:#0E7A4B;font-size:13px;font-weight:700;margin-top:12px;text-align:center}
.lg{display:flex;align-items:center;justify-content:space-between;padding:14px 12px 10px 18px;border-bottom:1px solid var(--line)}
.lg img{width:150px;height:auto;display:block}
.lg .x{background:#F1F4FB;border-radius:50%}
.pc{display:flex;align-items:center;gap:12px;width:calc(100% - 28px);margin:14px;border:0;border-radius:18px;background:var(--p);color:#fff;padding:12px;min-height:72px}
.pc .av{width:48px;height:48px;margin:0;flex:none;overflow:hidden}
.pc .nm{display:block;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .sb{display:block;font-size:12px;opacity:.92;margin-top:2px}
.dm{padding:0 14px 10px}
.dm .lb{font-size:12px;font-weight:700;color:var(--grey);margin:16px 8px 6px}
.it{transition:background .15s}.it:hover{background:#F1F4FB}.it.on:hover{background:#E6EFFF}
.it.on{font-weight:700}
.qb{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.qb .qh{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:8px}
.qb input[type=text]{width:100%;height:46px;border-radius:12px;border:1.5px solid var(--line);padding:0 12px;font:inherit;font-size:14px;color:var(--navy);background:#fff}
.qb input[type=text]:focus{outline:0;border-color:var(--p)}
.or{display:flex;align-items:center;gap:10px;margin-top:8px}
.or input[type=radio]{width:22px;height:22px;accent-color:var(--p);flex:none;margin:0}
.dl{width:44px;height:44px;border:0;border-radius:14px;background:#FFE3E8;display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.it .chev{margin-left:auto;font-size:22px;line-height:1;color:var(--grey);transition:transform .25s}
.it[aria-expanded=true] .chev{transform:rotate(90deg);color:var(--p)}
.it[aria-expanded=true]{background:#F1F4FB}
.acc{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease}
.acc.open{grid-template-rows:1fr}
.acc-in{overflow:hidden;min-height:0;padding:0 4px}
.acc.open .acc-in{padding:6px 4px 12px}
.acc-card{display:flex;gap:12px;align-items:center;padding:14px;border-radius:18px;border:1px solid var(--line);background:#F6F8FD}
.acc-av{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;background:var(--p);color:#fff;font-weight:800;font-size:19px}
.acc-who{display:flex;flex-direction:column;min-width:0}.acc-who b{font-size:15px}.acc-who span{font-size:12.5px;color:var(--grey);overflow-wrap:anywhere}
.acc-btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.acc-btns a,.acc-btns button{flex:1;min-height:40px;display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;padding:0 10px;border:0;border-radius:999px;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.acc-btns .call{background:#E6EFFF;color:#1558D6}.acc-btns .wa{background:#DDF5E8;color:#0E7A4B}.acc-btns .mail{background:#F1F4FB;color:#0B1F4B}
.acc-btns .cp{flex:0 1 auto;background:#F1F4FB;color:#0B1F4B;padding:0 14px}.acc-btns .cp.all{background:#E6EFFF;color:#1558D6}
.acc-text{font-size:13px;line-height:1.7;color:#2B3858;margin:4px 4px 0}
@media(prefers-reduced-motion:reduce){.acc,.chev{transition:none}}
.acc-btns .cp.sel{background:var(--p);color:#fff}
.qpl{font-size:12px;font-weight:700;color:var(--grey);margin:10px 4px 0}.qpl:first-child{margin-top:2px}
.acc-btns.pf a{flex:1 1 100%;justify-content:flex-start;padding:0 14px}
.qrow{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:44px;margin-top:6px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:#fff;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--navy);text-align:left}
.qrow.sel{background:#E6EFFF;border-color:var(--p);color:var(--p);font-weight:700}
.qrow .chev{font-size:20px;line-height:1;color:var(--grey);transition:transform .25s}
.qrow[aria-expanded=true] .chev{transform:rotate(90deg);color:var(--p)}
.qrow .chg{font-size:12px;font-weight:700}
.qlist{max-height:230px;overflow-y:auto}
.dr{width:250px;max-width:78%}
.cat i{position:relative}
.lk{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:#fff;border:1px solid var(--line);font-size:12px;display:flex;align-items:center;justify-content:center;font-style:normal}
.sw{flex:none;width:52px;height:30px;border-radius:15px;border:0;background:#C7CFE2;position:relative;padding:0;transition:background .2s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--red)}.sw.on::after{transform:translateX(22px)}.sw.g.on{background:#0E7A4B}
.rec-w{overflow:hidden;border-radius:18px}.rec-t{display:flex;transition:transform .5s ease}.rec-s{flex:0 0 100%;min-width:0}
.rec-d{display:flex;justify-content:center;gap:2px;margin-top:6px}.rec-b{width:22px;height:22px;border:0;background:none;padding:0;display:flex;align-items:center;justify-content:center}
.rec-b i{width:8px;height:8px;border-radius:4px;background:#C7CFE2;transition:width .3s,background .3s}.rec-b.on i{width:20px;background:var(--p)}
@media(prefers-reduced-motion:reduce){.rec-t,.rec-b i{transition:none}}
.pfs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.pfs div{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center}
.pfs b{display:block;font-size:20px;font-weight:800;color:var(--p)}.pfs span{font-size:11px;color:var(--grey);font-weight:600}
.pfc{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:10px}
.pfc svg{width:100%;height:auto;display:block}
.pfm{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pfm .ib{background:#F1F4FB}.pfm .ib:disabled{opacity:.35}
.pfm .mn{font-size:15px;font-weight:800;text-align:center;flex:1}
.pfn{font-size:12px;color:var(--grey);text-align:center;margin-top:6px}
.pfb{flex:none;min-width:64px;text-align:center;border-radius:14px;padding:6px 8px}.pfb b{display:block;font-size:16px;font-weight:800}.pfb span{font-size:11px;font-weight:700}
.pfr{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--navy);padding:6px 0;border-top:1px solid var(--line)}.pfr:first-of-type{border-top:0}
.pfr span{color:var(--grey)}
.tst{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);max-width:340px;width:calc(100% - 40px);background:var(--navy);color:#fff;font-size:13px;font-weight:600;line-height:1.4;padding:12px 16px;border-radius:14px;text-align:center;z-index:50}


a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none;white-space:nowrap}
button.card{width:100%;text-align:left;font:inherit;color:inherit}
/* ---------- CONTENT PROTECTION ---------- */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea{-webkit-user-select:text;user-select:text}
img{-webkit-user-drag:none;pointer-events:auto}
#app.hide{filter:blur(22px);pointer-events:none}
@media print{body{display:none!important}}
.device-clock{height:34px;min-width:58px;padding:0 9px;border:1px solid var(--line);border-radius:17px;background:#F7F9FC;color:#0B1F4B;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;box-shadow:0 3px 10px rgba(11,31,75,.06)}

/* ---------- UPDATE: font size, review, Hindi font ---------- */
.q{font-size:calc(18px*var(--fs,1))}
.opt{font-size:calc(14px*var(--fs,1))}
.fsr{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.fsb{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--grey)}
.fsb button{min-width:44px;height:38px;border-radius:19px;border:1.5px solid var(--line);background:#fff;color:var(--p);font:inherit;font-weight:800;font-size:14px}
.rvh{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;margin-bottom:4px}
.rvt{display:flex;align-items:center;gap:12px}.rvp{font-size:34px;font-weight:800;color:var(--p);line-height:1}
.rvn{font-size:12px;font-weight:700;color:var(--grey);flex:1;min-width:0}
.rcs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.rc{border:1.5px solid var(--line);border-radius:14px;background:#fff;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:54px;font-family:inherit}
.rc b{font-size:18px}.rc span{font-size:10.5px;font-weight:700}
.rc.a{color:var(--p)}.rc.g{color:#0E7A4B}.rc.r{color:var(--red)}.rc.s{color:var(--grey)}
.rc.on{border-width:2px}
.rc.a.on{background:#E6EFFF;border-color:var(--p)}.rc.g.on{background:#DDF5E8;border-color:#0E7A4B}.rc.r.on{background:#FFE3E8;border-color:var(--red)}.rc.s.on{background:#EEF1F8;border-color:var(--grey)}
.rq{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:12px}
.rq.s-ok{border-color:#9AD9B8}.rq.s-bad{border-color:#F0A3B4}
.rqh{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;color:var(--grey)}
.rb.s-ok{color:#0E7A4B}.rb.s-bad{color:var(--red)}
.rqt{font-size:calc(15px*var(--fs,1));font-weight:700;line-height:1.5;margin:8px 0 10px}
.ro{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;margin-top:6px;border-radius:12px;border:1.5px solid var(--line);font-size:calc(13.5px*var(--fs,1));line-height:1.45}
.ro .rm{flex:none;width:16px;font-weight:800}
.ro.c-ok{background:#DDF5E8;border-color:#0E7A4B;color:#085C37;font-weight:700}
.ro.c-bad{background:#FFE3E8;border-color:var(--red);color:#9B1B3B;font-weight:700}
.wt{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.wt img{width:210px;max-width:70%;height:auto;display:block;mix-blend-mode:multiply}
.sp{width:46px;height:46px;border:4px solid var(--line);border-top-color:var(--p);border-radius:50%;animation:spin 1s linear infinite;margin:28px 0 16px}
@keyframes spin{to{transform:rotate(360deg)}}
#splash{position:fixed;inset:0;z-index:99999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity .35s ease}
#splash.out{opacity:0;pointer-events:none}
#splash img{width:210px;max-width:70%;height:auto;display:block;mix-blend-mode:multiply}
@media(prefers-reduced-motion:reduce){#splash{transition:none}}
.wh{font-size:18px;font-weight:800;color:var(--navy)}.ws{font-size:13px;color:var(--grey);margin-top:6px}
.rx{margin-top:10px;padding:10px 12px;border-radius:12px;background:#FFF8E6;border:1px solid #F2DDA4;font-size:calc(13px*var(--fs,1));line-height:1.65;color:#5A4410}
.q,.rqt,.opt span,.ro span{white-space:pre-line}
.mt{margin:8px 0;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.mr{display:grid;grid-template-columns:1fr 1fr}
.mr span{padding:8px 10px;font-size:calc(14px*var(--fs,1));font-weight:600;line-height:1.4;border-bottom:1px solid var(--line)}
.mr span+span{border-left:1px solid var(--line)}
.mr:last-child span{border-bottom:0}

ध में कौन-सा कथन सही नहीं है?",["दादू की समाधि सांभर में बनी है","उन्हें राजस्थान का कबीर कहा जाता है","1585 में वे अकबर से मिलने फतेहपुर सीकरी गए","उन्होंने जाति-प्रथा और मूर्ति पूजा का विरोध किया"],0,"दादू ने सांभर में कुछ समय रहकर उपदेश दिए, पर उनका देहावसान 1603 में नरायणा में हुआ। शेष तीनों कथन पुस्तक के अनुसार सही हैं।"],["संतों से संबंधित कौन-सा युग्म सही सुमेलित नहीं है?",["राणाबाई – गुरु रामानंद","मावजी – बेणेश्वर धाम","लालदास – धोलीदूब","हरिदास – कापड़ोद"],0,"राणाबाई के गुरु चतुरदास थे, रामानंद नहीं। रामानंद धन्ना और पीपा के गुरु थे। शेष तीनों युग्म पुस्तक के अनुसार सही हैं।"]],"s":"RBSE कक्षा 10 · राजस्थान का इतिहास एवं कला संस्कृति"},{"min":35,"cat":"rbse","sub":{"rbse":"c10"},"s":"RBSE कक्षा 10 · राजस्थान का इतिहास एवं कला संस्कृति","id":206,"t":"Chapter 3 · उत्सव, त्योहार, मेले · Part-1","qs":[["गणगौर शब्द में ‘गण’ किसका प्रतीक है?",["शिव","पार्वती","गणेश","हनुमान"],0,"पुस्तक के अनुसार गण का अर्थ शिव और गौर का अर्थ गौरी यानी पार्वती है। इस पर्व में अविवाहित कन्याएँ अच्छे वर की और विवाहित स्त्रियाँ पति की लंबी आयु की कामना से ईसरजी (शिव) और गणगौर (पार्वती) की पूजा करती हैं। इसलिए पार्वती वाला विकल्प ‘गौर’ से जुड़ता है, ‘गण’ से नहीं, और गणेश या हनुमान का इस शब्द से संबंध नहीं है।"],["तीज का पर्व किस माह की शुक्ल तृतीया को मनाया जाता है?",["श्रावण","भाद्रपद","चैत्र","वैशाख"],0,"तीज वर्षा ऋतु का त्योहार है और पूरे राजस्थान में श्रावण शुक्ल तृतीया को मनाया जाता है। इस दिन कन्याएँ और नवविवाहिताएँ झूले डालकर गीत गाती हैं। भाद्रपद कृष्ण तृतीया को केवल बूँदी की कजली तीज मनाई जाती है, इसलिए वह सामान्य तीज की तिथि नहीं है। चैत्र में गणगौर और वैशाख में अक्षय तृतीया मनाई जाती है।"],["बूँदी में कजली तीज किस माह में मनाई जाती है?",["भाद्रपद","श्रावण","फाल्गुन","चैत्र"],0,"जहाँ पूरे राजस्थान में तीज श्रावण में मनाई जाती है, वहीं बूँदी में कजली तीज भाद्रपद कृष्ण तृतीया को मनाई जाती है। सजी हुई पालकियों में तीज की सवारी नवल सागर से शुरू होकर कुम्भा स्टेडियम तक पहुँचती है। श्रावण वाला विकल्प सामान्य तीज का है, इसलिए यहाँ सही नहीं है, और फाल्गुन तथा चैत्र का इस पर्व से संबंध नहीं बताया गया।"],["अक्षय तृतीया किस माह की शुक्ल तृतीया को मनाई जाती है?",["वैशाख","चैत्र","आषाढ़","कार्तिक"],0,"वैशाख शुक्ल तृतीया को अक्षय तृतीया कहा जाता है। इसे ऐसी शुभ तिथि माना जाता है जिसके लिए अलग से मुहूर्त देखने की जरूरत नहीं होती, इसीलिए इसे अबूझ सावा भी कहते हैं। चैत्र शुक्ल तृतीया को गणगौर का समापन होता है, इसलिए वह तिथि भ्रम पैदा करती है। आषाढ़ और कार्तिक का इस पर्व से कोई संबंध नहीं बताया गया।"],["गणगौर पर्व चैत्र कृष्ण प्रतिपदा से किस तिथि तक चलता है?",["चैत्र शुक्ल तृतीया","चैत्र शुक्ल पूर्णिमा","वैशाख प्रतिपदा","फाल्गुन पूर्णिमा"],0,"पुस्तक के अनुसार गणगौर होली के दूसरे दिन चैत्र कृष्ण प्रतिपदा से शुरू होकर चैत्र शुक्ल तृतीया तक चलता है। इसी अवधि में होली की राख की पिंडियों और जौ के अंकुरों की पूजा होती है। फाल्गुन पूर्णिमा होली की तिथि है, इसलिए वह आरंभ से पहले की तिथि है। चैत्र पूर्णिमा और वैशाख प्रतिपदा इस पर्व की सीमा नहीं हैं।"],["गणगौर पूजा में होली की राख से बनी पिंडियों के साथ किसके अंकुर पूजे जाते हैं?",["जौ","गेहूँ","बाजरा","तिल"],0,"पुस्तक में बताया गया है कि गणगौर पर होली की राख से बनी पिंडियों की जौ के अंकुरों के साथ पूजा की जाती है। कन्याएँ फूलों को कलश में सजाकर घर लाती हैं और गणगौर के गीत गाती हैं। गेहूँ, बाजरा और तिल जैसे अनाज अक्षय तृतीया की सात अनाज की पूजा में आते हैं, गणगौर के अंकुरों में नहीं।"],["कर्नल टॉड ने गणगौर की सवारी का रोचक वर्णन किस नगर के संदर्भ में किया है?",["उदयपुर","जयपुर","जोधपुर","कोटा"],0,"टॉड ने उदयपुर की गणगौर सवारी का वर्णन किया है, जिसमें सब जातियों की स्त्रियाँ, बच्चे और पुरुष गहनों और रंगीन कपड़ों में अटारियों से जुलूस देखते हैं। सवारी तोप और नगाड़ों की ध्वनि के साथ महल से निकलकर पिछोला झील के गणगौर घाट तक जाती है। जयपुर, जोधपुर और कोटा में भी यह पर्व धूमधाम से मनता है, पर टॉड का वर्णन उदयपुर का है।"],["उदयपुर में गणगौर की सवारी पिछोला झील के किस घाट पर पहुँचती है?",["गणगौर घाट","हनुमान घाट","अंबा घाट","दूध तलाई घाट"],0,"पुस्तक के अनुसार सवारी महल से तोप और नगाड़ों की ध्वनि के साथ पिछोला झील के गणगौर घाट पर पहुँचती है, जहाँ नौका विहार और आतिशबाजी के साथ समाप्त होती है। घाट का नाम पर्व के नाम से ही ाप्त होता है","गलत – कहावत का तीज से कोई संबंध नहीं"],0,"यह कथन सही है। तीज श्रावण शुक्ल तृतीया को आती है और कहावत बताती है कि त्योहारों का सिलसिला तीज से शुरू होकर चैत्र की गणगौर पर समाप्त होता है। चैत्र में गणगौर होती है, तीज नहीं, इसलिए दूसरा विकल्प गलत है। चक्र का अंत दीपावली पर बताना भी पुस्तक के विरुद्ध है।"],["निम्नलिखित में से कौन-सा कथन सही नहीं है?",["बाड़मेर की पत्थरमार होली में इलोजी की बारात खुशी के गीतों के साथ समाप्त होती है","भीनाय में कोड़ामार होली खेली जाती है","शेखावाटी में गिंदड़ नृत्य होता है","मेवाड़ में गेर नृत्य होता है"],0,"बाड़मेर की पत्थरमार होली में इलोजी की बारात निकलती है, जो बाद में रोने-बिलखने में बदल जाती है, इसलिए खुशी में समाप्त होने का कथन गलत है। बाकी तीनों कथन पुस्तक के अनुसार सही हैं। इस होली का उद्देश्य लोगों का मनोरंजन करना है, उसमें करुणा का पुट भी दिखता है।"],["निम्नलिखित में से कौन-सा युग्म सही सुमेलित नहीं है?",["नवरोज़ – ईसाई पर्व","गुड फ्राइडे – ईसाई पर्व","ईस्टर – ईसाई पर्व","क्रिसमस – ईसाई पर्व"],0,"पुस्तक के अनुसार नव वर्ष (1 जनवरी), ईस्टर, गुड फ्राइडे और क्रिसमस ईसाई समुदाय के प्रमुख पर्व हैं। नवरोज़ ईसाई पर्व नहीं है, यही अभ्यास प्रश्न का भी उत्तर है। इसलिए पहला युग्म सही सुमेलित नहीं है और बाकी तीनों युग्म सही हैं।"]]},{"min":35,"cat":"rbse","sub":{"rbse":"c10"},"s":"RBSE कक्षा 10 · राजस्थान का इतिहास एवं कला संस्कृति","id":207,"t":"Chapter 3 · उत्सव, त्योहार, मेले · Part-2","qs":[["भारत में ब्रह्माजी का एकमात्र पूजित मंदिर कहाँ है?",["पुष्कर (अजमेर)","कोलायत (बीकानेर)","आबू (सिरोही)","नाथद्वारा (राजसमंद)"],0,"पुस्तक के अनुसार पुष्कर में स्थित मंदिर भारत में ब्रह्माजी का एकमात्र मंदिर है जहाँ उनकी विधिवत पूजा होती है। इसके पीछे की पहाड़ी पर सावित्री का मंदिर भी है। कोलायत कपिल मुनि के मेले के लिए, आबू जैन मंदिरों के लिए और नाथद्वारा श्रीनाथजी के लिए जाने जाते हैं, इसलिए वे विकल्प गलत हैं।"],["देशनोक का करणी माता मंदिर किस नाम से प्रसिद्ध है?",["चूहों का मंदिर","ऊँटों का मंदिर","साँपों का मंदिर","मोरों का मंदिर"],0,"बीकानेर जिले की नोखा तहसील के देशनोक में बीकानेर के राठौड़ शासकों की कुलदेवी करणी माता का मंदिर है। उनकी विधिवत पूजा होती है और पीछे की पहाड़ी पर सावित्री का मंदिर है। कोलायत कपिल मुनि के मेले के लिए और आबू जैन मंदिरों के लिए प्रसिद्ध हैं। इसलिए बाकी विकल्प गलत स्थान या तथ्य देते हैं।"],["निम्नलिखित में से कौन-सा कथन सही नहीं है?",["करणी माता का मंदिर जयपुर में स्थित है","करणी माता बीकानेर के राठौड़ शासकों की कुलदेवी हैं","देशनोक का मंदिर चूहों के लिए प्रसिद्ध है","देशनोक बीकानेर जिले की नोखा तहसील में है"],0,"करणी माता का मंदिर देशनोक में है, जो बीकानेर जिले की नोखा तहसील में आता है, जयपुर में नहीं, इसलिए पहला कथन गलत है। करणी माता बीकानेर के राठौड़ शासकों की कुलदेवी हैं और मंदिर में चूहे निर्भय घूमते हैं, इसीलिए इसे चूहों का मंदिर कहते हैं। बाकी तीनों कथन पुस्तक से मेल खाते हैं।"],["निम्नलिखित में से कौन-सा युग्म सही सुमेलित नहीं है?",["तेजाजी का मेला – रूणिचा","रामदेवजी का मेला – रूणिचा","पाबूजी का मेला – कोलूगढ़","गोगाजी का मेला – ददरेवा"],0,"पुस्तक के अनुसार तेजाजी का मेला परबतसर में लगता है, रूणिचा में नहीं, इसलिए पहला युग्म सही नहीं है। रामदेवजी का मेला रूणिचा (पोकरण), पाबूजी का कोलूगढ़ और गोगाजी का ददरेवा में लगता है। ये सब लोक देवताओं के मेलों की श्रेणी में आते हैं, इसलिए बाकी तीनों युग्म सही हैं।"]]},{"id":107,"t":"Chapter 7 · लोक संगीत","s":"RBSE कक्षा 10 · राजस्थान का इतिहास एवं कला संस्कृति","min":30,"cat":"rbse","sub":{"rbse":"c10"},"qs":[["लोक संगीत का आधार क्या है?",["लोकगीत","शास्त्रीय राग","केवल वाद्य यंत्र","नृत्य मुद्राएँ"],0,"लोक संगीत का आधार लोकगीत हैं, जो अलग-अलग त्योहारों, संस्कारों और अवसरों पर समूह में गाए जाते हैं। लोक वाद्य इन गीतों की मधुरता बढ़ाते हैं, पर आधार नहीं हैं। शास्त्रीय राग नियमबद्ध होते हैं और सीखने पड़ते हैं, जबकि लोक संगीत भावनाओं की स्वाभाविक अभिव्यक्ति है। नृत्य मुद्राएँ अलग कला हैं। गांधीजी ने लोकगीतों को जनता की भाषा और संस्कृति का संरक्षक कहा था।"],["‘पधारो म्हारे देश’ गीत किस प्रसिद्ध मांड गायिका से जुड़ा है?",["पद्मश्री अल्लाह जिलाई बाई","मीराबाई","गवरी देवी","कोमल कोठारी"],0,"‘पधारो म्हारे देश’ मांड गायन का प्रसिद्ध गीत है, जिसे पद्मश्री अल्लाह जिलाई बाई ने गाया। पुस्तक इसे पर्यटकों को राजस्थान आने का खुला निमंत्रण बताती है। मांड गायन विश्वभर में प्रसिद्ध है। मीराबाई भक्ति कवयित्री हैं, इसलिए उनका इस गीत से संबंध नहीं है। गवरी देवी और कोमल कोठारी के नाम पुस्तक में इस गीत के संदर्भ में नहीं आए। इसलिए पहला विकल्प ही सही है।"],["मेवाड़ में लड़कियों द्वारा दीपावली से पहले गाए जाने वाले गीत को क्या कहा जाता है?",["घड़ल्यो","लोवड़ी","हरनी","जच्चा"],0,"दीपावली से लगभग 15 दिन पहले बच्चे घर-घर जाकर गीत गाते हैं। लड़कों के गीत लोवड़ी या हरनी कहलाते हैं, जबकि लड़कियों के गीत घड़ल्यो कहलाते हैं। यह परंपरा मेवाड़ क्षेत्र में प्रचलित है। इसलिए लड़कियों के लिए सही उत्तर घड़ल्यो है। जच्चा गीत संतान के जन्म पर गाए जाने वाले गीत हैं, इसलिए वह विकल्प बच्चों के इन गीतों से संबंधित नहीं है।"],["संतान के जन्म पर गाए जाने वाले गीत कहलाते हैं?",["जच्चा","जला","घोड़ी","बन्ना-बन्नी"],0,"संतान के जन्म पर गाए जाने वाले गीत जच्चा कहलाते हैं। इनमें होने वाली माँ की प्रशंसा, परिवार के बढ़ने की खुशी और नवजात को आशीर्वाद दिया जाता है। जला गीत वर पक्ष का जानवासा देखने जाती वधू पक्ष की महिलाओं से जुड़े हैं। घोड़ी गीत वर की घुड़चढ़ी के समय गाया जाता है और बन्ना-बन्नी विवाह के बाद प्रेम की भावना दर्शाते हैं। इसलिए जच्चा ही सही है।"],["वर की घुड़चढ़ी के समय कौन-सा गीत गाया जाता है?",["घोड़ी","जच्चा","जला","इंदोणी"],0,"वर की रवानगी या घुड़चढ़ी के समय ‘घोड़ी’ गीत गाया जाता है। विवाह के अवसर पर सगाई, बधावा, चाक-भात, हल्दी, बिंदौली, तोरण और जला जैसे अनेक संस्कारों के गीत गाए जाते हैं, इसलिए हर रस्म का अपना गीत है। जच्चा गीत संतान जन्म के हैं और जला गीत वधू पक्ष की महिलाओं के जानवासा देखने से जुड़े हैं। इंदोणी अलग लोकगीत है, जो वस्तुओं के माध्यम से भाव प्रकट करता है।"],["विवाह के बाद वर-वधू की प्रेम भावना किन गीतों में झलकती है?",["बन्ना-बन्नी","जला","जच्चा","कुरजाँ"],0,"बन्ना-बन्नी गीतों में विवाह के बाद वर-वधू के प्रेम की इच्छा और भावना झलकती है। पुस्तक में विवाह से जुड़े गीतों की लंबी सूची दी गई है और जन्म तथा विवाह के गीत अन्य अवसरों के गीतों से कहीं अधिक हैं। जला गीत जानवासा देखने जाती वधू पक्ष की महिलाओं से जुड़े हैं और जच्चा गीत संतान के जन्म से। कुरजाँ मरु क्षेत्र का प्रसिद्ध गीत है, इसलिए वह भी सही नहीं है।"],["गणगौर का पर्व किस माह में सोलह दिन तक मनाया जाता है?",["चैत्र","फाल्गुन","श्रावण","भाद्रपद"],0,"गणगौर का पर्व चैत्र माह में अविवाहित कन्याओं और विवाहित स्त्रियों द्वारा 16 दिन तक विधि-विधान से मनाया जाता है। पुस्तक में इसका प्रसिद्ध गीत ‘खेलन दो गणगौर’ दिया गया है। फाल्गुन में होली का समय आता है और श्रावण में तीज मनाई जाती है, इसलिए वे इस पर्व का माह नहीं हैं। भाद्रपद का संबंध इस प्रसंग में किसी प्रमुख गीत-पर्व से नहीं दिया गया है। इसलिए चैत्र सही है।"],["होली के समय फाल्गुन में पुरुष समूह कौन-से गीत गाते हैं?",["रसिया, होरी, धमाल","पपैयो, बादली, मोर","जच्चा, घोड़ी, जला","लूर, ओलूँ, हिचकी"],0,"फाल्गुन माह में होली के समय राजस्थान के हर क्षेत्र में पुरुषों की टोलियाँ रसिया, होरी और धमाल जैसे गीत गाती दिखती हैं। फाल्गुन हिंदू पंचांग का अंतिम माह है। पपैयो, बादली और मोर श्रावण से जुड़े ऋतु गीत हैं। जच्चा, घोड़ी और जला विवाह-जन्म के गीत हैं, जबकि लूर, ओळूँ और हिचकी ऐसे गीत हैं जिनमें भाव किसी वस्तु के माध्यम से प्रकट होते हैं।"],["तीज के गीत किस माह की प्राकृतिक सुंदरता का वर्णन करते हैं?",["श्रावण","चैत्र","माघ","फाल्गुन"],0,"तीज के गीतों में श्रावण मास की प्राकृतिक सुंदरता का चित्रण होता है, क्योंकि तीज वर्षा ऋतु का पर्व है। पुस्तक में तीज और गणगौर को राजस्थान के महत्वपूर्ण त्योहार बताया गया है। चैत्र में गणगौर और फाल्गुन में होली के गीत गाए जाते हैं। माघ का उल्लेख इस प्रसंग में तीज के गीतों के रूप में नहीं आया है। इसलिए श्रावण ही सही उत्तर है।"],["मांड गायन के अधिकांश दोहे किन रागों पर आधारित हैं?",["देस और सोरठ","भैरवी और यमन","मल्हार और दरबारी","मालकौंस और भीमपलासी"],0,"मांड के अधिकतर दोहे देस और सोरठ रागों पर आधारित होते हैं। मांड गायन विश्व प्रसिद्ध है और उदयपुर, जोधपुर, जयपुर-बीकानेर और जैसलमेर में इसके अलग-अलग रूप मिलते हैं। भैरवी-यमन, मल्हार-दरबारी और मालकौंस-भीमपलासी जैसे राग इस प्रसंग में पुस्तक में नहीं दिए गए। युद्ध के वीर गीत अलग हैं और उनका आधार सिंधु तथा मारू राग माने गए हैं।"],["युद्ध के समय व्यावसायिक जातियों द्वारा गाए जाने वाले वीर गीत किन रागों पर आधारित हैं?",["सिंधु और मारू","देस और सोरठ","आसावरी और बिलावल","पीलू और खमाज"],0,"व्यावसायिक जाति const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const prep=t=>Object.assign({},t,{qs:shuf(t.qs).map(q=>{const ix=shuf(q[1].map((_,k)=>k));return[q[0],ix.map(k=>q[1][k]),ix.indexOf(q[2]),q[3]||'']})});
const runSave=()=>{try{localStorage.setItem('urooj_run',JSON.stringify({t:S.test,i:S.i,ans:S.ans,end:S.end}))}catch(e){}};
const runClear=()=>{try{localStorage.removeItem('urooj_run')}catch(e){}};
const FSL=[0.85,1,1.15,1.3,1.5,1.75];
let FS=1;try{const v=+localStorage.getItem('urooj_fs');if(FSL.includes(v))FS=v}catch(e){}
let RF='all';
function fsStep(d){let k=FSL.indexOf(FS);k=Math.max(0,Math.min(FSL.length-1,(k<0?1:k)+d));FS=FSL[k];try{localStorage.setItem('urooj_fs',FS)}catch(e){}render()}
const fmt=()=>String(Math.floor(S.left/60)).padStart(2,'0')+':'+String(S.left%60).padStart(2,'0');
function tick(){S.left=Math.max(0,Math.ceil((S.end-Date.now())/1000));if(S.left<=0){finish();return}const e=$('tm');if(e){e.textContent=fmt();e.classList.toggle('low',S.left<60)}}
function runTimer(){clearInterval(timer);timer=setInterval(tick,500)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.view==='test')tick()});
function start(id){const t0=TESTS.find(t=>t.id==id);if(!t0)return;
 if(!ADM&&lockedT(t0)){toast('🔒 Ye test abhi locked hai.');return}
 S.test=prep(t0);S.i=0;S.ans={};S.end=Date.now()+S.test.min*60000;S.left=S.test.min*60;S.view='test';
 runSave();runTimer();render();scrollTo(0,0)}
function showRes(id){const r=RES[id];if(!r){toast('Result nahi mila.');return}S.res=r;RF='all';S.view='result';render();scrollTo(0,0)}
function resumeRun(){try{const r=JSON.parse(localStorage.getItem('urooj_run'));if(!r||!r.t||!r.t.qs||!r.end)return;
 S.test=r.t;S.i=Math.min(r.i||0,r.t.qs.length-1);S.ans=r.ans||{};S.end=r.end;
 if(Date.now()>=S.end){finish();return}
 S.view='test';runTimer();tick()}catch(e){runClear()}}
function finish(){clearInterval(timer);runClear();const t=S.test,n=t.qs.length;
 const correct=t.qs.filter((q,i)=>S.ans[i]===q[2]).length,att=Object.keys(S.ans).length,d=new Date().toLocaleDateString('en-IN');

 DVOW={'अ':'a','आ':'a','इ':'i','ई':'i','उ':'u','ऊ':'u','ऋ':'ri','ए':'e','ऐ':'ai','ओ':'o','औ':'au','ऑ':'o'},
 DMAT={'ा':'a','ि':'i','ी':'i','ु':'u','ू':'u','ृ':'ri','े':'e','ै':'ai','ो':'o','ौ':'au','ॉ':'o','ॅ':'e'};
function rom(x){x=x.replace(/ज्ञ/g,'gy');let o='';const a=[...x];
 for(let i=0;i<a.length;i++){const c=a[i];
  if(DCONS[c]){o+=DCONS[c];const n=a[i+1];if(n==='\u093C')i++;const m=a[i+1];if(m==='्'){i++}else if(DMAT[m]){o+=DMAT[m];i++}else o+='a'}
  else if(DVOW[c])o+=DVOW[c];else if(c==='ं'||c==='ँ')o+='n';else if(c==='ः')o+='h';else if(c==='\u093C'||c==='्'){}else o+=c}
 return o}
function skel(x){return rom(String(x).toLowerCase()).toLowerCase().replace(/sh/g,'s').replace(/ch/g,'c').replace(/(k|g|j|t|d|b|p)h/g,'$1').replace(/z/g,'j').replace(/f/g,'p').replace(/w/g,'v').replace(/q/g,'k').replace(/x/g,'ks').replace(/[aeiouh]/g,'').replace(/(.)\1+/g,'$1')}
const EN2HI={history:'itihas',culture:'sanskriti',art:'kala',chapter:'adhyay',class:'kaksha',folk:'lok',deity:'devta',saint:'sant',music:'sangeet',introduction:'parichay',unification:'ekikaran',freedom:'swatantrata',independence:'swatantrata',movement:'andolan',heritage:'dharohar virasat',tradition:'parampara',bravery:'shaurya',geography:'bhugol',polity:'rajvyavastha rajniti',economy:'arthvyavastha',science:'vigyan',maths:'ganit',math:'ganit',mathematics:'ganit',environment:'paryavaran',question:'prashn',fort:'kila durg',temple:'mandir',painting:'chitrakala',fair:'mela',festival:'tyohar',dance:'nritya',king:'raja naresh',war:'yuddh',battle:'yuddh',society:'samaj',religion:'dharm',literature:'sahitya',language:'bhasha',tourism:'paryatan',architecture:'sthapatya',sculpture:'murtikala',revolt:'vidroh kranti',revolution:'kranti',treaty:'sandhi',constitution:'samvidhan',general:'samanya',knowledge:'gyan',teacher:'shikshak adhyapak',teaching:'shikshan',education:'shiksha',exam:'pariksha',syllabus:'pathyakram',rajasthan:'rajasthan',india:'bharat',ancient:'prachin',medieval:'madhyakalin',modern:'adhunik',village:'gram',city:'nagar shahar',river:'nadi',desert:'registan marusthal',people:'jan lok'};
const _EK=Object.keys(EN2HI).map(en=>[en,skel(en),EN2HI[en].split(' ').map(skel)]);
function qCands(tok){const k=skel(tok),low=tok.toLowerCase(),c=new Set([k]);
 for(const[en,ek,hs]of _EK){if(ek===k||en===low)hs.forEach(h=>c.add(h));else if(hs.includes(k))c.add(ek)}
 return[...c].filter(Boolean)}
const _TK=/[\p{L}\p{M}\p{N}]+/gu;
function smatch(t,q){q=(q||'').trim().toLowerCase();if(!q)return true;
 if(!t._h){const c=CATS.find(x=>x.id===t.cat);const sb=(t.sub&&SUBS[t.cat]&&SUBS[t.cat].find(x=>x[0]===t.sub[t.cat]))||[];const raw=(t.t+' '+t.s+' '+(c?c.n:'')+' '+(sb[1]||'')).toLowerCase();t._h={raw,sk:(raw.match(_TK)||[]).map(skel).filter(Boolean)}}
 if(t._h.raw.includes(q))return true;
 return (q.match(_TK)||[]).every(tok=>t._h.raw.includes(tok)||qCands(tok).some(k=>k.length>=2?t._h.sk.some(h=>h.startsWith(k)):t._h.sk.some(h=>h===k)))}

let PMY=new Date().getFullYear(),PMM=new Date().getMonth(),PL=20;
const hdt=h=>{if(h.ts)return{d:new Date(h.ts),tm:true};const m=String(h.date||'').split('/');return{d:m.length===3?new Date(+m[2],+m[1]-1,+m[0]):new Date(0),tm:false}};
const hpc=h=>h.total?Math.round(h.correct/h.total*100):0;
const pfD=a=>a.d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})+(a.tm?', '+a.d.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit',hour12:true}):'');
const pfC=p=>p>=70?['#DDF5E8','#0E7A4B']:p>=40?['#FFF1D8','#8A5A13']:['#FFE3E8','#C2264B'];
function perfMonth(d){const n=new Date(),t=new Date(PMY,PMM+d,1);if(t>new Date(n.getFullYear(),n.getMonth(),1))return;
 const e=S.hist.reduce((m,h)=>{const x=hdt(h).d;return x<m?x:m},new Date());if(d<0&&t<new Date(e.getFullYear(),e.getMonth(),1))return;
 PMY=t.getFullYear();PMM=t.getMonth();render()}
function perfMore(){PL+=20;render()}
const pfG=(W,L,R,T,ch)=>[0,25,50,75,100].map(v=>{const y=T+ch-v/100*ch;return`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#DDE5F5" stroke-width="1"/><text x="${L-5}" y="${y+3}" text-anchor="end" font-size="9" fill="#55607E">${v}%</text>`}).join('');
function pfLine(pts,X,Y,lab){const line=pts.length>1?`<polyline fill="none" stroke="#1558D6" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" points="${pts.map(q=>X(q.x)+','+Y(q.y)).join(' ')}"/>`:'';
 return line+pts.map(q=>`<circle cx="${X(q.x)}" cy="${Y(q.y)}" r="4" fill="#1558D6" stroke="#fff" stroke-width="1.5"/>`+(lab?`<text x="${X(q.x)}" y="${Y(q.y)-8}" text-anchor="middle" font-size="9" font-weight="700" fill="#0B1F4B">${q.y}</text>`:'')).join('')}
function monthChart(mA){
 const dim=new Date(PMY,PMM+1,0).getDate(),W=340,H=190,L=34,R=10,T=14,B=26,cw=W-L-R,ch=H-T-B,by={};
 mA.forEach(a=>{const k=a.d.getDate();(by[k]=by[k]||[]).push(a.p)});
 const pts=Object.keys(by).map(k=>({x:+k,y:Math.round(by[k].reduce((x,y)=>x+y,0)/by[k].length)})).sort((x,y)=>x.x-y.x);
 const X=d=>L+(dim>1?(d-1)/(dim-1):0)*cw,Y=v=>T+ch-v/100*ch;
 const ds=[1,5,10,15,20,25,30].filter(d=>d<=dim);if(dim-ds[ds.length-1]>=3)ds.push(dim);
 return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Din ke hisaab se average percentage">${pfG(W,L,R,T,ch)}${ds.map(d=>`<text x="${X(d)}" y="${H-8}" text-anchor="middle" font-size="9" fill="#55607E">${d}</text>`).join('')}${pfLine(pts,X,Y,pts.length<=12)}</svg>`}
function reChart(g){
 const a=g.slice(-10),n=a.length,W=340,H=160,L=34,R=16,T=16,B=26,cw=W-L-R,ch=H-T-B;
 const X=i=>L+(n>1?i/(n-1):0)*cw,Y=v=>T+ch-v/100*ch;
 return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Har attempt me percentage">${pfG(W,L,R,T,ch)}${a.map((q,i)=>`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="9" fill="#55607E">#${g.length-n+i+1}</text>`).join('')}${pfLine(a.map((q,i)=>({x:i,y:q.p})),X,Y,true)}</svg>`}
function perf(){
 if(!S.hist.length)return`<div class="pad"><h2 style="margin-top:0">Performance</h2>${soon('📊','Abhi koi data nahi','Test dene ke baad yahan aapki progress dikhegi.')}</div>`;
 const A=S.hist.map((h,i)=>{const x=hdt(h);return{h,i,d:x.d,tm:x.tm,p:hpc(h)}}).sort((a,b)=>(b.d-a.d)||(a.i-b.i));
 const avg=Math.round(A.reduce((t,a)=>t+a.p,0)/A.length),best=Math.max(...A.map(a=>a.p));
 const now=new Date(),isCur=PMY===now.getFullYear()&&PMM===now.getMonth();
 const e=A.reduce((m,a)=>a.d<m?a.d:m,new Date()),isFirst=PMY<e.getFullYear()||(PMY===e.getFullYear()&&PMM<=e.getMonth());
 const mA=A.filter(a=>a.d.getFullYear()===PMY&&a.d.getMonth()===PMM);
 const mAvg=mA.length?Math.round(mA.reduce((t,a)=>t+a.p,0)/mA.length):0;
 const mName=new Date(PMY,PMM,1).toLocaleDateString('en-IN',{month:'long',year:'numeric'});
 const G={};A.slice().reverse().forEach(a=>{(G[a.h.title]=G[a.h.title]||[]).push(a)});
 const multi=Object.values(G).filter(g=>g.length>1).sort((x,y)=>y[y.length-1].d-x[x.length-1].d);
 const re=multi.length?multi.map(g=>{const f=g[0].p,l=g[g.length-1].p,df=l-f;
  return`<div class="pfc"><div class="t" style="font-size:14px;font-weight:700">${esc(g[0].h.title)}</div>
  <div class="s" style="font-size:12px;color:var(--grey);margin:3px 0 8px">${g.length} attempts · Pehla ${f}% → Ab ${l}% <b style="color:${df>0?'#0E7A4B':df<0?'#C2264B':'#55607E'}">${df>0?'▲ +'+df:df<0?'▼ '+df:'– 0'}%</b></div>
  ${reChart(g)}
  <div style="margin-top:8px">${g.slice(-10).map((q,i,a)=>`<div class="pfr"><b>Attempt ${g.length-a.length+i+1}</b><span>${pfD(q)}</span><b style="color:${pfC(q.p)[1]}">${q.p}% · ${q.h.correct}/${q.h.total}</b></div>`).join('')}</div></div>`}).join('')
  :`<p class="mut">🔄 Kisi test ko dobara dene (Reattempt) par yahan har attempt ka progress chart dikhega.</p>`;
 const hist=A.slice(0,PL).map(a=>{const c=pfC(a.p);return`<div class="card"><div style="flex:1;min-width:0"><div class="t">${esc(a.h.title)}</div><div class="s">🗓 ${pfD(a)}</div></div><div class="pfb" style="background:${c[0]};color:${c[1]}"><b>${a.p}%</b><span>${a.h.correct}/${a.h.total}</span></div></div>`}).join('');
 return`<div class="pad"><h2 style="margin-top:0">Performance</h2>
 <div class="pfs"><div><b>${A.length}</b><span>Total attempts</span></div><div><b>${avg}%</b><span>Average</span></div><div><b>${best}%</b><span>Best score</span></div></div>
 <h2>Mahine ka progress</h2>
 <div class="pfc"><div class="pfm"><button class="ib" aria-label="Pichla mahina" ${isFirst?'disabled':''} onclick="perfMonth(-1)">${svg('<path d="M15 6l-6 6 6 6"/>','#0B1F4B')}</button><div class="mn">${mName}${isCur?' · Is mahine':''}</div><button class="ib" aria-label="Agla mahina" ${isCur?'disabled':''} onclick="perfMonth(1)">${svg('<path d="M9 6l6 6-6 6"/>','#0B1F4B')}</button></div>
 <div style="margin-top:10px">${monthChart(mA)}</div>
 <div class="pfn">${mA.length?mA.length+' attempts · Average '+mAvg+'% (din ke hisaab se)':'Is mahine koi test nahi diya.'}</div></div>
 <h2>Reattempt progress</h2>${re}
 <h2>Attempt history</h2>${hist}
 ${A.length>PL?`<button class="btn o" style="width:100%;margin-top:12px" onclick="perfMore()">Aur dikhayein</button>`:''}</div>`}

/* ===== THEME (mode + color) ===== */
const THEMES=[
 {id:'blue',n:'Ocean Blue',l:'#1558D6',d:'#5B93FF',t:'#E6EFFF'},
 {id:'violet',n:'Teams Violet',l:'#6C5CE7',d:'#8F82FF',t:'#ECE9FF'},
 {id:'orchid',n:'Orchid',l:'#B04DDB',d:'#CB74F0',t:'#F6E7FC'},
 {id:'rose',n:'Rose',l:'#E04A68',d:'#FF7189',t:'#FFE6EB'},
 {id:'orange',n:'Sunset',l:'#EE7A22',d:'#FFA056',t:'#FFEEDD'},
 {id:'green',n:'Emerald',l:'#10A06B',d:'#34D399',t:'#DDF5E8'}];
let TH={mode:'light',color:'blue'};
try{const x=JSON.parse(localStorage.getItem('urooj_theme')||'null');if(x&&x.mode)TH.mode=x.mode;if(x&&THEMES.some(t=>t.id===x.color))TH.color=x.color}catch(e){}
function isDark(){return TH.mode==='dark'||(TH.mode==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)}
function applyTheme(){
 const r=document.documentElement,t=THEMES.find(x=>x.id===TH.color)||THEMES[0],d=isDark();
 r.setAttribute('data-mode',d?'dark':'light');r.setAttribute('data-color',t.id);
 r.style.setProperty('--p',d?t.d:t.l);
 r.style.setProperty('--tint',d?`color-mix(in srgb,${t.d} 22%,#23253F)`:t.t);
 let m=document.querySelector('meta[name=theme-color]');if(!m){m=document.createElement('meta');m.name='theme-color';document.head.appendChild(m)}
 m.content=d?'#15162B':'#F6F8FD';
 document.querySelectorAll('.mbtn').forEach(b=>b.classList.toggle('sel',b.dataset.m===TH.mode));
 document.querySelectorAll('.cbtn').forEach(b=>b.classList.toggle('sel',b.dataset.c===TH.color));
}
function saveTheme(){try{localStorage.setItem('urooj_theme',JSON.stringify(TH))}catch(e){}}
function setMode(m){TH.mode=m;saveTheme();applyTheme()}
function setColor(c){TH.color=c;saveTheme();applyTheme()}
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(TH.mode==='auto')applyTheme()})}catch(e){}
applyTheme();

 <div class="tp-l">Color theme</div><div class="crow">${THEMES.map(t=>`<button class="cbtn ${TH.color===t.id?'sel':''}" data-c="${t.id}" onclick="setColor('${t.id}')" aria-label="${t.n}"><i style="background:linear-gradient(135deg,${t.l},${t.d})"></i>${t.n}</button>`).join('')}</div>`}
