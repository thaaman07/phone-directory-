<style>
:root{--p:#1558D6;--navy:#0B1F4B;--grey:#55607E;--bg:#F6F8FD;--line:#DDE5F5;--red:#C2264B}
*{box-sizing:border-box}
body{margin:0;background:#E9EEF9;font-family:'Plus Jakarta Sans','Noto Sans Devanagari',system-ui,sans-serif;color:var(--navy)}
button{font-family:inherit;cursor:pointer}
#app{max-width:430px;min-height:100vh;margin:0 auto;background:var(--bg);position:relative;padding-bottom:84px}
.pad{padding:20px 18px}
.hd{display:flex;align-items:center;gap:8px}.hd>div[style*="flex:1"]{min-width:0}.bellcol{display:flex;flex-direction:column;align-items:center;gap:2px;flex:none}.bellcol .device-clock{height:22px;min-width:50px;padding:0 8px;border-radius:11px;box-shadow:none}.bellcol .ib{height:40px}

h2{font-size:16px;font-weight:700;margin:22px 0 0}
.cats{display:flex;justify-content:space-between;margin-top:12px}

.ci{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none}

.btn{flex:none;height:44px;padding:0 14px;border:0;border-radius:22px;background:var(--p);color:#fff;font-size:12px;font-weight:700}

.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:76px;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}

.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.timer{font-weight:800;color:var(--p);font-size:15px}.timer.low{color:var(--red)}
.q{font-size:18px;font-weight:700;line-height:1.45;margin:18px 0}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;text-align:left;padding:12px;margin-bottom:10px;border-radius:14px;border:1.5px solid var(--line);background:#fff;color:var(--navy);font-size:14px}
.opt.on{border-color:var(--p);background:#E6EFFF}
.opt u{width:20px;height:20px;border-radius:50%;border:2px solid var(--grey);flex:none;text-decoration:none}

.sh{position:absolute;inset:0;background:rgba(11,31,75,.45);opacity:0;transition:opacity .25s}
.ov.open .sh{opacity:1}
.dr{position:absolute;top:0;bottom:0;left:0;width:290px;max-width:84%;background:#fff;transform:translateX(-100%);transition:transform .25s ease;display:flex;flex-direction:column;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom)}

.df{margin-top:auto;padding:16px 22px;font-size:11px;color:var(--grey);border-top:1px solid var(--line)}

.subs{display:flex;gap:8px;margin-top:14px;overflow-x:auto;padding-bottom:2px}

.chip.on{background:var(--p);border-color:var(--p);color:#fff}
.board-switch{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.board-card{min-height:86px;border:1.5px solid var(--line);border-radius:18px;background:#fff;color:var(--navy);display:flex;align-items:center;gap:10px;padding:10px 12px;font:inherit;font-size:13px;font-weight:800;text-align:left}
.board-card.on{border-color:var(--p);background:#E6EFFF;color:var(--p);box-shadow:0 0 0 1px rgba(21,88,214,.08)}
.board-logo{width:54px;height:54px;border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;line-height:1}
.board-logo span{font-size:10px;font-weight:900;letter-spacing:.3px}

.rbse-logo{background:#FFF1D8;border:2px solid #C98B2E;color:#8A5A13}
.ncert-logo{background:#E8F1FF;border:2px solid #1558D6;color:#1558D6}

.pic{display:flex;flex-direction:column;align-items:center;margin:8px 0 18px}
.pic .ph{width:104px;height:104px;border-radius:50%;background:#DCE8FF;display:flex;align-items:center;justify-content:center;overflow:hidden;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.pic img,.av img{width:100%;height:100%;object-fit:cover}
.pic label{margin-top:12px;min-height:44px;display:flex;align-items:center;padding:0 18px;border-radius:22px;border:1.5px solid var(--p);color:var(--p);font-size:13px;font-weight:700;cursor:pointer}
.fld{margin-bottom:14px}.fld label{display:block;font-size:12px;font-weight:700;color:var(--grey);margin-bottom:6px}
.fld input{width:100%;height:48px;border-radius:14px;border:1.5px solid var(--line);background:#fff;padding:0 14px;font:inherit;font-size:14px;color:var(--navy)}

.err{color:var(--red);font-size:12px;margin-top:4px}
.ok{color:#0E7A4B;font-size:13px;font-weight:700;margin-top:12px;text-align:center}
.lg{display:flex;align-items:center;justify-content:space-between;padding:14px 12px 10px 18px;border-bottom:1px solid var(--line)}
.lg img{width:150px;height:auto;display:block}

.pc{display:flex;align-items:center;gap:12px;width:calc(100% - 28px);margin:14px;border:0;border-radius:18px;background:var(--p);color:#fff;padding:12px;min-height:72px}
.pc .av{width:48px;height:48px;margin:0;flex:none;overflow:hidden}

.dm{padding:0 14px 10px}
.dm .lb{font-size:12px;font-weight:700;color:var(--grey);margin:16px 8px 6px}
.it{transition:background .15s}.it:hover{background:#F1F4FB}.it.on:hover{background:#E6EFFF}
.it.on{font-weight:700}
.qb{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.qb .qh{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:8px}
.qb input[type=text]{width:100%;height:46px;border-radius:12px;border:1.5px solid var(--line);padding:0 12px;font:inherit;font-size:14px;color:var(--navy);background:#fff}
.qb input[type=text]:focus{outline:0;border-color:var(--p)}
.or{display:flex;align-items:center;gap:10px;margin-top:8px}
.or input[type=radio]{width:22px;height:22px;accent-color:var(--p);flex:none;margin:0}
.dl{width:44px;height:44px;border:0;border-radius:14px;background:#FFE3E8;display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.it .chev{margin-left:auto;font-size:22px;line-height:1;color:var(--grey);transition:transform .25s}
.it[aria-expanded=true] .chev{transform:rotate(90deg);color:var(--p)}
.it[aria-expanded=true]{background:#F1F4FB}
.acc{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease}
.acc.open{grid-template-rows:1fr}
.acc-in{overflow:hidden;min-height:0;padding:0 4px}
.acc.open .acc-in{padding:6px 4px 12px}
.acc-card{display:flex;gap:12px;align-items:center;padding:14px;border-radius:18px;border:1px solid var(--line);background:#F6F8FD}
.acc-av{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;background:var(--p);color:#fff;font-weight:800;font-size:19px}
.acc-who{display:flex;flex-direction:column;min-width:0}.acc-who b{font-size:15px}.acc-who span{font-size:12.5px;color:var(--grey);overflow-wrap:anywhere}
.acc-btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.acc-btns a,.acc-btns button{flex:1;min-height:40px;display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;padding:0 10px;border:0;border-radius:999px;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.acc-btns .call{background:#E6EFFF;color:#1558D6}.acc-btns .wa{background:#DDF5E8;color:#0E7A4B}.acc-btns .mail{background:#F1F4FB;color:#0B1F4B}
.acc-btns .cp{flex:0 1 auto;background:#F1F4FB;color:#0B1F4B;padding:0 14px}.acc-btns .cp.all{background:#E6EFFF;color:#1558D6}
.acc-text{font-size:13px;line-height:1.7;color:#2B3858;margin:4px 4px 0}
@media(prefers-reduced-motion:reduce){.acc,.chev{transition:none}}
.acc-btns .cp.sel{background:var(--p);color:#fff}
.qpl{font-size:12px;font-weight:700;color:var(--grey);margin:10px 4px 0}.qpl:first-child{margin-top:2px}
.acc-btns.pf a{flex:1 1 100%;justify-content:flex-start;padding:0 14px}
.qrow{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:44px;margin-top:6px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:#fff;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--navy);text-align:left}
.qrow.sel{background:#E6EFFF;border-color:var(--p);color:var(--p);font-weight:700}
.qrow .chev{font-size:20px;line-height:1;color:var(--grey);transition:transform .25s}
.qrow[aria-expanded=true] .chev{transform:rotate(90deg);color:var(--p)}
.qrow .chg{font-size:12px;font-weight:700}
.qlist{max-height:230px;overflow-y:auto}
.dr{width:250px;max-width:78%}
.cat i{position:relative}
.lk{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:#fff;border:1px solid var(--line);font-size:12px;display:flex;align-items:center;justify-content:center;font-style:normal}
.sw{flex:none;width:52px;height:30px;border-radius:15px;border:0;background:#C7CFE2;position:relative;padding:0;transition:background .2s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--red)}.sw.on::after{transform:translateX(22px)}.sw.g.on{background:#0E7A4B}
.rec-w{overflow:hidden;border-radius:18px}.rec-t{display:flex;transition:transform .5s ease}.rec-s{flex:0 0 100%;min-width:0}
.rec-d{display:flex;justify-content:center;gap:2px;margin-top:6px}.rec-b{width:22px;height:22px;border:0;background:none;padding:0;display:flex;align-items:center;justify-content:center}
.rec-b i{width:8px;height:8px;border-radius:4px;background:#C7CFE2;transition:width .3s,background .3s}.rec-b.on i{width:20px;background:var(--p)}
@media(prefers-reduced-motion:reduce){.rec-t,.rec-b i{transition:none}}
.pfs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.pfs div{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center}

.pfc{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:10px}

.pfm{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pfm .ib{background:#F1F4FB}.pfm .ib:disabled{opacity:.35}
.pfm .mn{font-size:15px;font-weight:800;text-align:center;flex:1}
.pfn{font-size:12px;color:var(--grey);text-align:center;margin-top:6px}
.pfb{flex:none;min-width:64px;text-align:center;border-radius:14px;padding:6px 8px}.pfb b{display:block;font-size:16px;font-weight:800}.pfb span{font-size:11px;font-weight:700}
.pfr{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--navy);padding:6px 0;border-top:1px solid var(--line)}.pfr:first-of-type{border-top:0}
.pfr span{color:var(--grey)}
.tst{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);max-width:340px;width:calc(100% - 40px);background:var(--navy);color:#fff;font-size:13px;font-weight:600;line-height:1.4;padding:12px 16px;border-radius:14px;text-align:center;z-index:50}


a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none;white-space:nowrap}
button.card{width:100%;text-align:left;font:inherit;color:inherit}

body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea{-webkit-user-select:text;user-select:text}

.shfab{position:absolute;bottom:84px;right:calc(10% - 29px);width:58px;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;padding:0;z-index:5}
.shfab i{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#FF2E63,#FF8A00);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(255,46,99,.4);border:3px solid #fff}
.shfab b{font-size:9.5px;font-weight:800;color:#0B1F4B;background:#fff;border-radius:8px;padding:1px 6px;box-shadow:0 2px 6px rgba(11,31,75,.15);white-space:nowrap}
#shorts{position:fixed;inset:0;z-index:9998;background:#000;color:#fff;display:flex;flex-direction:column}

.exg{display:flex;gap:8px;margin-bottom:6px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch}.exg::-webkit-scrollbar{display:none}.exg .exb{flex:0 0 calc(25% - 6px);scroll-snap-align:start}.exgp{display:grid;grid-template-columns:repeat(4,1fr);overflow:visible}.exgp .exb{flex:none}

.pf-ph{width:104px;height:104px;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden;box-shadow:0 0 0 4px rgba(255,255,255,.35)}
.pf-ph img{width:100%;height:100%;object-fit:cover}
.pf-cam{position:absolute;right:-2px;bottom:2px;width:34px;height:34px;border-radius:50%;background:#FF7A59;border:3px solid #fff;display:grid;place-items:center;cursor:pointer}
.pf-nm{font-size:20px;font-weight:800}.pf-gr{font-size:12.5px;opacity:.85;margin-top:3px}
.pf-st{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:-18px 12px 14px;position:relative}
.pf-st div{background:#fff;border:1px solid var(--line);border-radius:16px;padding:11px 4px;text-align:center;box-shadow:0 6px 16px rgba(11,31,75,.07)}
.pf-st b{display:block;font-size:18px;color:var(--p)}.pf-st span{font-size:10.5px;color:var(--grey);font-weight:700}
.pf-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:14px;margin-bottom:12px}
.pf-card h3{margin:2px 4px 10px;font-size:14px}
.pf-f{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:16px;padding:9px 12px;margin-bottom:9px;background:#FAFBFF}
.pf-f:focus-within{border-color:var(--p);background:#fff}
.pf-i{width:36px;height:36px;border-radius:11px;background:#E6EFFF;color:var(--p);display:grid;place-items:center;flex:none}
.pf-b{flex:1;min-width:0}.pf-b small{display:block;font-size:10.5px;color:var(--grey);font-weight:700}
.pf-b input{width:100%;border:0;background:transparent;font:inherit;font-size:14px;font-weight:600;color:var(--navy);padding:2px 0;outline:0}
.pf-save{width:100%;height:50px;border-radius:25px;font-size:14px}
.pf-clr{width:100%;margin-top:10px;height:44px;border-radius:22px;border:1.5px solid #F0A3B4;background:#fff;color:#C8244B;font:inherit;font-weight:700;font-size:13px}
.pf-note{text-align:center;font-size:11.5px;color:var(--grey);margin:12px 0 0}
.ed-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.ed-bar .btn{height:40px;padding:0 16px;border-radius:20px;font-size:13px}
.ed-card{padding:14px}.ed-h{display:flex;justify-content:space-between;align-items:center}
.ed-l{font-size:11px;font-weight:800;color:#55607E;margin:11px 0 5px}.ed-l small{font-weight:600;color:#7A849C}
.ed-in{width:100%;box-sizing:border-box;border:1.5px solid #DCE4F1;border-radius:12px;padding:10px 12px;font:inherit;font-size:13.5px;background:#fff;color:#0B1F4B}
textarea.ed-in{resize:vertical;line-height:1.5}
.ed-in:focus{outline:0;border-color:#1558D6}
.ed-o{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.ed-o>span{font-weight:800;font-size:12px;width:14px;color:#55607E}
.ed-o input[type=radio]{width:20px;height:20px;accent-color:#0E7A4B;flex:none}
.rx .xm{margin-top:6px}.rx .xo{margin-top:7px;padding:7px 9px;border-radius:10px;background:#fff;border:1px solid #F2DDA4}.rx .xo b{display:block;font-size:12.5px;color:#5A4410}.rx .xo.g{border-color:#9AD9B8;background:#F0FBF5}.rx .xo.g b{color:#0E7A4B}.rx .xo.r b{color:#9B1B3B}.rx .xo span{display:block;font-size:12px;margin-top:2px;color:#3b3b3b}

/* ===== Responsive: tablet and desktop fill the screen ===== */
@media(min-width:600px){
 #app{max-width:none}
 #app>.pad{max-width:1200px;margin-left:auto;margin-right:auto;padding:26px 32px}
 #app>.pad:has(.opt){max-width:860px}
 .tabs{max-width:none;left:0;transform:none}
 .ov,.sheetw{max-width:none;left:0;transform:none}
 #list{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;align-items:stretch}
 #list>*{margin-top:0}
 #list>:not(.card){grid-column:1/-1}
 .ban h1{font-size:30px}.ban p{font-size:14px;max-width:60%}
 .q{font-size:calc(21px*var(--fs,1))}
 .opt{font-size:calc(16px*var(--fs,1));min-height:58px}
 .card .t{font-size:16px}
 .tst{max-width:420px}
}
@media(min-width:1000px){
 #app>.pad{padding:30px 48px}
 #list{grid-template-columns:repeat(3,1fr)}
 .ban h1{font-size:34px}
 .q{font-size:calc(23px*var(--fs,1))}
}

.secH{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 8px;font-weight:800;font-size:14px;color:var(--navy)}
.secH em{font-style:normal;font-size:11px;color:var(--grey);font-weight:700;background:#EEF3FF;padding:3px 10px;border-radius:99px}
.card.tg{cursor:pointer}.card.tg:active{transform:scale(.99)}
.tga{font-size:26px;color:var(--p);font-weight:700;padding:0 4px;flex:none}
.tgb{display:flex;align-items:center;gap:10px;margin:2px 0 12px;flex-wrap:wrap}
.tgb button{border:1.5px solid var(--line);background:#fff;color:var(--p);border-radius:999px;padding:7px 14px;font:inherit;font-weight:800;font-size:12.5px}
.tgb span{font-size:12px;font-weight:700;color:var(--grey)}
</style>

const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

 if(!(force&&ADM)&&lockedT(t0)){toast('🔒 This test is currently locked.');return}

 S.test=prep(t0);S.i=0;S.ans={};S.end=Date.now()+S.test.min*60000;S.left=S.test.min*60;S.view='test';

 const id=MPF.e;

const DCONS={'क':'k','ख':'kh','ग':'g','घ':'gh','ङ':'n','च':'ch','छ':'ch','ज':'j','झ':'jh','ञ':'n','ट':'t','ठ':'th','ड':'d','ढ':'dh','ण':'n','त':'t','थ':'th','द':'d','ध':'dh','न':'n','प':'p','फ':'f','ब':'b','भ':'bh','म':'m','य':'y','र':'r','ल':'l','ळ':'l','व':'v','श':'sh','ष':'sh','स':'s','ह':'h'},
 DVOW={'अ':'a','आ':'a','इ':'i','ई':'i','उ':'u','ऊ':'u','ऋ':'ri','ए':'e','ऐ':'ai','ओ':'o','औ':'au','ऑ':'o'},
 DMAT={'ा':'a','ि':'i','ी':'i','ु':'u','ू':'u','ृ':'ri','े':'e','ै':'ai','ो':'o','ौ':'au','ॉ':'o','ॅ':'e'};
function rom(x){x=x.replace(/ज्ञ/g,'gy');let o='';const a=[...x];
 for(let i=0;i<a.length;i++){const c=a[i];
  if(DCONS[c]){o+=DCONS[c];const n=a[i+1];if(n==='\u093C')i++;const m=a[i+1];if(m==='्'){i++}else if(DMAT[m]){o+=DMAT[m];i++}else o+='a'}
  else if(DVOW[c])o+=DVOW[c];else if(c==='ं'||c==='ँ')o+='n';else if(c==='ः')o+='h';else if(c==='\u093C'||c==='्'){}else o+=c}
 return o}
function skel(x){return rom(String(x).toLowerCase()).toLowerCase().replace(/sh/g,'s').replace(/ch/g,'c').replace(/(k|g|j|t|d|b|p)h/g,'$1').replace(/z/g,'j').replace(/f/g,'p').replace(/w/g,'v').replace(/q/g,'k').replace(/x/g,'ks').replace(/[aeiouh]/g,'').replace(/(.)\1+/g,'$1')}
const EN2HI={history:'itihas',culture:'sanskriti',art:'kala',chapter:'adhyay',class:'kaksha',folk:'lok',deity:'devta',saint:'sant',music:'sangeet',introduction:'parichay',unification:'ekikaran',freedom:'swatantrata',independence:'swatantrata',movement:'andolan',heritage:'dharohar virasat',tradition:'parampara',bravery:'shaurya',geography:'bhugol',polity:'rajvyavastha rajniti',economy:'arthvyavastha',science:'vigyan',maths:'ganit',math:'ganit',mathematics:'ganit',environment:'paryavaran',question:'prashn',fort:'kila durg',temple:'mandir',painting:'chitrakala',fair:'mela',festival:'tyohar',dance:'nritya',king:'raja naresh',war:'yuddh',battle:'yuddh',society:'samaj',religion:'dharm',literature:'sahitya',language:'bhasha',tourism:'paryatan',architecture:'sthapatya',sculpture:'murtikala',revolt:'vidroh kranti',revolution:'kranti',treaty:'sandhi',constitution:'samvidhan',general:'samanya',knowledge:'gyan',teacher:'shikshak adhyapak',teaching:'shikshan',education:'shiksha',exam:'pariksha',syllabus:'pathyakram',rajasthan:'rajasthan',india:'bharat',ancient:'prachin',medieval:'madhyakalin',modern:'adhunik',village:'gram',city:'nagar shahar',river:'nadi',desert:'registan marusthal',people:'jan lok'};
const _EK=Object.keys(EN2HI).map(en=>[en,skel(en),EN2HI[en].split(' ').map(skel)]);
function qCands(tok){const k=skel(tok),low=tok.toLowerCase(),c=new Set([k]);
 for(const[en,ek,hs]of _EK){if(ek===k||en===low)hs.forEach(h=>c.add(h));else if(hs.includes(k))c.add(ek)}
 return[...c].filter(Boolean)}
const _TK=/[\p{L}\p{M}\p{N}]+/gu;
function smatch(t,q){q=(q||'').trim().toLowerCase();if(!q)return true;
 if(!t._h){const c=CATS.find(x=>x.id===t.cat);const sb=(t.sub&&SUBS[t.cat]&&SUBS[t.cat].find(x=>x[0]===t.sub[t.cat]))||[];const raw=(t.t+' '+t.s+' '+(c?c.n:'')+' '+(sb[1]||'')).toLowerCase();t._h={raw,sk:(raw.match(_TK)||[]).map(skel).filter(Boolean)}}
 if(t._h.raw.includes(q))return true;
 return (q.match(_TK)||[]).every(tok=>t._h.raw.includes(tok)||qCands(tok).some(k=>k.length>=2?t._h.sk.some(h=>h.startsWith(k)):t._h.sk.some(h=>h===k)))}

 const g=TGRP.find(x=>x.id===S.grp);
 if(!S.top){if(!g.tp.length)return crumb()+soon('🚧','Coming Soon',g.n+' ke topics aur tests jald hi yahan milenge. 🎯');
  return crumb()+g.tp.map((p,k)=>`<div class="card tg" onclick="tto(${k})"><div class="ci" style="background:#FFF1E4;font-size:22px">📍</div><div style="flex:1;min-width:0"><div class="t">${esc(p)}</div><div class="s">${cnt(g.id,p)?cnt(g.id,p)+' Tests':'Coming soon'}</div></div><span class="tga">›</span></div>`).join('')}
 const a=r.filter(t=>t.grp===S.grp&&t.top===S.top);
 return crumb()+(a.length?a.map(tc).join(''):soon('🚧','Coming Soon',S.top+' ke tests jald hi yahan milenge. 🎯'))}

 const r=TESTS.filter(t=>(!S.cat||t.cat===S.cat||(t.sub&&t.sub[S.cat]))&&(!S.sub||(t.sub&&t.sub[S.cat]===S.sub))&&smatch(t,q));
 if(!r.length&&!(S.cat==='teaching'&&S.sub==='g3'&&!q))return q?soon('🔍','No tests found','Try a different name or topic.'):soon('🚧','Coming Soon',S.sub?(SUBS[S.cat].find(x=>x[0]===S.sub)[1]+' tests are coming soon. 🎯'):'Tests for this category are coming soon. Meanwhile, explore another category. 🎯');

 <div style="flex:1;min-width:0"><div class="t">${lockedT(t)?'🔒 ':''}${esc(t.t)}</div><div class="s">${esc(t.s)}</div><div class="m">${qn(t)} Questions &nbsp;|&nbsp; ${t.min} Minutes</div></div>

 if(S.cat==='teaching'&&S.sub==='g3'&&!q)return tgHTML(r,q,tc);
 if(!S.cat&&!q){const pend=r.filter(t=>!RES[t.id]&&!lockedT(t));return recHTML((pend.length?pend:r).slice(0,4),tc)}
  if(r.some(t=>t.sec)){const g={};r.forEach(t=>{const k=t.sec||'Other Tests';(g[k]=g[k]||[]).push(t)});return Object.entries(g).map(([k,a])=>`<div class="secH"><span>📍 ${esc(k)}</span><em>${a.length} test${a.length>1?'s':''}</em></div>`+a.map(tc).join('')).join('')}
  return r.map(tc).join('')}

let RCI=0,RCT=null;
function recHTML(a,tc){if(RCI>=a.length)RCI=0;return`<div class="rec-w"><div class="rec-t" id="rcTrack" data-n="${a.length}" style="transform:translateX(-${RCI*100}%)">${a.concat(a.length>1?[a[0]]:[]).map(t=>`<div class="rec-s">${tc(t)}</div>`).join('')}</div></div>${a.length>1?`<div class="rec-d" id="rcDots">${a.map((_,i)=>`<button class="rec-b ${i===RCI?'on':''}" aria-label="Test ${i+1}" onclick="recGo(${i},1)"><i></i></button>`).join('')}</div>`:''}`}
let RCJ=0;
function recGo(i,man){const t=$('rcTrack');if(!t)return;clearTimeout(RCJ);const n=+t.dataset.n;
 if(i>=n&&n>1){RCI=0;t.style.transform='translateX(-'+n*100+'%)';RCJ=setTimeout(()=>{const e=$('rcTrack');if(!e)return;e.style.transition='none';e.style.transform='translateX(0)';void e.offsetWidth;e.style.transition=''},520)}
 else{RCI=i;t.style.transform='translateX(-'+i*100+'%)'}
 document.querySelectorAll('#rcDots .rec-b').forEach((b,k)=>b.classList.toggle('on',k===RCI));if(man)recStart()}

async function upFile(inp){const f=inp.files[0];if(!f)return;UP.busy=1;UP.fn=f.name;UP.rows=null;UP.bad=[];render();keepScroll();
 try{const ext=(f.name.split('.').pop()||'').toLowerCase();let A;
  if(ext==='csv'||ext==='xlsx'||ext==='xls'){await ldJS('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});A=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''})}

function papersAdmin(){
 PAD=Object.assign({l:'l1',t:'gk',gp:'A',sb:'Urdu',u:''},PAD);
 const G=GRADES,opt=(a,v)=>a.map(([k,l])=>`<option value="${k}" ${String(k)===String(v)?'selected':''}>${l}</option>`).join(''),sel='width:100%;height:48px;border-radius:14px;border:1.5px solid var(--line);background:#fff;padding:0 12px;font:inherit;font-size:14px;color:var(--navy)';
 const fld=(l,id,o)=>`<div class="fld"><label>${l}</label><select id="${id}" onchange="papF()" style="${sel}">${o}</select></div>`;
 const lab=p=>{const a=[];if(!p.l)a.push((p.t||'gk')==='gk'?'GK':'Subject');if(p.gp)a.push('Group '+p.gp);if(p.sb)a.push(p.sb);if(p.l)a.push((QL.find(x=>x[0]===p.l)||[0,''])[1]);return a.join(' · ')};
 const rows=[];G.forEach(([g,gl])=>Object.keys(PAPERS[g]||{}).sort((a,b)=>b-a).forEach(y=>(PAPERS[g][y]||[]).forEach((p,i)=>rows.push(`<div class="admin-card"><div class="admin-card-row"><div class="admin-icon" style="background:#FFF1D8">📄</div><div class="admin-main"><b>${esc(p.n)}</b><span>${gl} · ${y} · ${lab(p)}</span></div><button class="admin-mini danger" onclick="papDel('${g}',${y},${i})">🗑 Delete</button></div></div>`))));
 let f=fld('Grade','pg',opt(G,PAD.g));
 if(qpNeedL(PAD.g))f+=fld('Level','pl',opt(QL,PAD.l));
 f+=fld('Year','py',opt(YEARS.map(y=>[y,y]),PAD.y));
 const T=qpNeedL(PAD.g)?(PAD.l==='l2'?'sub':'gk'):PAD.t;
 if(!qpNeedL(PAD.g))f+=fld('Paper name','pt',opt([['gk','GK'],['sub','Subject']],PAD.t));
 if(T==='gk'&&qpNeedGp(PAD.g))f+=fld('Group','pgp',opt(QGP.map(x=>[x,'Group '+x]),PAD.gp));
 if(T==='sub')f+=fld('Subject','psb',opt(QSB.map(x=>[x,x]),PAD.sb));
 return`<div class="admin-card">${f}<div class="fld"><label>PDF link</label><input id="pu" type="url" placeholder="https://drive.google.com/..." value="${esc(PAD.u||'')}"></div><button class="btn" style="width:100%;height:48px;border-radius:24px" onclick="papAdd()">＋ Add paper</button></div>`+(rows.length?rows.join(''):'<div class="admin-empty">No papers added yet.</div>')}
function papRead(){const v=i=>{const e=$(i);return e?e.value:''};PAD={g:v('pg')||PAD.g,l:v('pl')||PAD.l||'l1',y:+v('py')||PAD.y,t:v('pt')||PAD.t||'gk',gp:v('pgp')||PAD.gp||'A',sb:v('psb')||PAD.sb||'Urdu',u:v('pu')}}
function papF(){papRead();keepScroll()}
function papSave(){try{localStorage.setItem('urooj_papers',JSON.stringify(PAPERS))}catch(e){toast('Could not save.')}fbPush()}
function papAdd(){papRead();const{g,l,y,t,gp,sb}=PAD,u=(PAD.u||'').trim();
 if(!u){toast('Enter the PDF link.');return}
 if(!/^https?:\/\//i.test(u)){toast('The link must start with http:// or https://');return}
 const T=qpNeedL(g)?(l==='l2'?'sub':'gk'):t;const it={n:'',u,t:T};if(qpNeedL(g))it.l=l;
 if(qpNeedL(g)&&T==='gk'){it.n='Paper'}else if(T==='gk'){it.n='GK Paper';if(qpNeedGp(g)){it.gp=gp;it.n+=' · Group '+gp}}else{it.sb=sb;it.n=sb+' Paper'}
 (PAPERS[g]=PAPERS[g]||{});(PAPERS[g][y]=PAPERS[g][y]||[]).unshift(it);PAD.u='';papSave();keepScroll()}
function papDel(g,y,i){if(!confirm('Delete this paper?'))return;const a=(PAPERS[g]||{})[y];if(!a)return;a.splice(i,1);if(!a.length)delete PAPERS[g][y];papSave();keepScroll()}

let PMY=new Date().getFullYear(),PMM=new Date().getMonth(),PL=20;
const hdt=h=>{if(h.ts)return{d:new Date(h.ts),tm:true};const m=String(h.date||'').split('/');return{d:m.length===3?new Date(+m[2],+m[1]-1,+m[0]):new Date(0),tm:false}};
const hpc=h=>h.total?Math.round(h.correct/h.total*100):0;
const pfD=a=>a.d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})+(a.tm?', '+a.d.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit',hour12:true}):'');
const pfC=p=>p>=70?['#DDF5E8','#0E7A4B']:p>=40?['#FFF1D8','#8A5A13']:['#FFE3E8','#C2264B'];
function perfMonth(d){const n=new Date(),t=new Date(PMY,PMM+d,1);if(t>new Date(n.getFullYear(),n.getMonth(),1))return;
 const e=S.hist.reduce((m,h)=>{const x=hdt(h).d;return x<m?x:m},new Date());if(d<0&&t<new Date(e.getFullYear(),e.getMonth(),1))return;

const pfG=(W,L,R,T,ch)=>[0,25,50,75,100].map(v=>{const y=T+ch-v/100*ch;return`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#DDE5F5" stroke-width="1"/><text x="${L-5}" y="${y+3}" text-anchor="end" font-size="9" fill="#55607E">${v}%</text>`}).join('');
function pfLine(pts,X,Y,lab){const line=pts.length>1?`<polyline fill="none" stroke="#1558D6" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" points="${pts.map(q=>X(q.x)+','+Y(q.y)).join(' ')}"/>`:'';
 return line+pts.map(q=>`<circle cx="${X(q.x)}" cy="${Y(q.y)}" r="4" fill="#1558D6" stroke="#fff" stroke-width="1.5"/>`+(lab?`<text x="${X(q.x)}" y="${Y(q.y)-8}" text-anchor="middle" font-size="9" font-weight="700" fill="#0B1F4B">${q.y}</text>`:'')).join('')}
function monthChart(mA){
 const dim=new Date(PMY,PMM+1,0).getDate(),W=340,H=190,L=34,R=10,T=14,B=26,cw=W-L-R,ch=H-T-B,by={};
 mA.forEach(a=>{const k=a.d.getDate();(by[k]=by[k]||[]).push(a.p)});
 const pts=Object.keys(by).map(k=>({x:+k,y:Math.round(by[k].reduce((x,y)=>x+y,0)/by[k].length)})).sort((x,y)=>x.x-y.x);
 const X=d=>L+(dim>1?(d-1)/(dim-1):0)*cw,Y=v=>T+ch-v/100*ch;
 const ds=[1,5,10,15,20,25,30].filter(d=>d<=dim);if(dim-ds[ds.length-1]>=3)ds.push(dim);
 return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Din ke hisaab se average percentage">${pfG(W,L,R,T,ch)}${ds.map(d=>`<text x="${X(d)}" y="${H-8}" text-anchor="middle" font-size="9" fill="#55607E">${d}</text>`).join('')}${pfLine(pts,X,Y,pts.length<=12)}</svg>`}
function reChart(g){
 const a=g.slice(-10),n=a.length,W=340,H=160,L=34,R=16,T=16,B=26,cw=W-L-R,ch=H-T-B;
 const X=i=>L+(n>1?i/(n-1):0)*cw,Y=v=>T+ch-v/100*ch;
 return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Har attempt me percentage">${pfG(W,L,R,T,ch)}${a.map((q,i)=>`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="9" fill="#55607E">#${g.length-n+i+1}</text>`).join('')}${pfLine(a.map((q,i)=>({x:i,y:q.p})),X,Y,true)}</svg>`}
function perf(){
 if(!S.hist.length)return`<div class="pad"><h2 style="margin-top:0">Performance</h2>${soon('📊','No data yet','Your progress will appear here after you take a test.')}</div>`;
 const A=S.hist.map((h,i)=>{const x=hdt(h);return{h,i,d:x.d,tm:x.tm,p:hpc(h)}}).sort((a,b)=>(b.d-a.d)||(a.i-b.i));
 const avg=Math.round(A.reduce((t,a)=>t+a.p,0)/A.length),best=Math.max(...A.map(a=>a.p));
 const now=new Date(),isCur=PMY===now.getFullYear()&&PMM===now.getMonth();
 const e=A.reduce((m,a)=>a.d<m?a.d:m,new Date()),isFirst=PMY<e.getFullYear()||(PMY===e.getFullYear()&&PMM<=e.getMonth());
 const mA=A.filter(a=>a.d.getFullYear()===PMY&&a.d.getMonth()===PMM);
 const mAvg=mA.length?Math.round(mA.reduce((t,a)=>t+a.p,0)/mA.length):0;
 const mName=new Date(PMY,PMM,1).toLocaleDateString('en-IN',{month:'long',year:'numeric'});
 const G={};A.slice().reverse().forEach(a=>{(G[a.h.title]=G[a.h.title]||[]).push(a)});
 const multi=Object.values(G).filter(g=>g.length>1).sort((x,y)=>y[y.length-1].d-x[x.length-1].d);
 const re=multi.length?multi.map(g=>{const f=g[0].p,l=g[g.length-1].p,df=l-f;
  return`<div class="pfc"><div class="t" style="font-size:14px;font-weight:700">${esc(g[0].h.title)}</div>
  <div class="s" style="font-size:12px;color:var(--grey);margin:3px 0 8px">${g.length} attempts · First ${f}% → Now ${l}% <b style="color:${df>0?'#0E7A4B':df<0?'#C2264B':'#55607E'}">${df>0?'▲ +'+df:df<0?'▼ '+df:'– 0'}%</b></div>
  ${reChart(g)}
  <div style="margin-top:8px">${g.slice(-10).map((q,i,a)=>`<div class="pfr"><b>Attempt ${g.length-a.length+i+1}</b><span>${pfD(q)}</span><b style="color:${pfC(q.p)[1]}">${q.p}% · ${q.h.correct}/${q.h.total}</b></div>`).join('')}</div></div>`}).join('')
  :`<p class="mut">🔄 When you reattempt a test, a progress chart for each attempt will appear here.</p>`;
 const hist=A.slice(0,PL).map(a=>{const c=pfC(a.p);return`<div class="card"><div style="flex:1;min-width:0"><div class="t">${esc(a.h.title)}</div><div class="s">🗓 ${pfD(a)}</div></div><div class="pfb" style="background:${c[0]};color:${c[1]}"><b>${a.p}%</b><span>${a.h.correct}/${a.h.total}</span></div></div>`}).join('');
 return`<div class="pad"><h2 style="margin-top:0">Performance</h2>
 <div class="pfs"><div><b>${A.length}</b><span>Total attempts</span></div><div><b>${avg}%</b><span>Average</span></div><div><b>${best}%</b><span>Best score</span></div></div>
 <h2>Monthly progress</h2>
 <div class="pfc"><div class="pfm"><button class="ib" aria-label="Pichla mahina" ${isFirst?'disabled':''} onclick="perfMonth(-1)">${svg('<path d="M15 6l-6 6 6 6"/>','#0B1F4B')}</button><div class="mn">${mName}${isCur?' · This month':''}</div><button class="ib" aria-label="Agla mahina" ${isCur?'disabled':''} onclick="perfMonth(1)">${svg('<path d="M9 6l6 6-6 6"/>','#0B1F4B')}</button></div>
 <div style="margin-top:10px">${monthChart(mA)}</div>
 <div class="pfn">${mA.length?mA.length+' attempts · Average '+mAvg+'% (din ke hisaab se)':'No tests taken this month.'}</div></div>
 <h2>Reattempt progress</h2>${re}
 <h2>Attempt history</h2>${hist}

const qn=t=>t.n||(t.qs?t.qs.length:0),hasQ=t=>!!(t.qs&&t.qs.length);
const tqiSave=()=>{try{localStorage.setItem('urooj_tqi',JSON.stringify(TQI))}catch(e){}};
const idbP=()=>new Promise((res,rej)=>{const r=indexedDB.open('urooj_tq',1);r.onupgradeneeded=()=>r.result.createObjectStore('q');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function idbGet(k){try{const d=await idbP();return await new Promise(r=>{const q=d.transaction('q').objectStore('q').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}}

async function tqEnsure(t){if(hasQ(t))return true;toast('Loading test…');let qs=null;
 if(navigator.onLine!==false){try{const X=await fbInit(),f=X.f;await X.auth.authStateReady();const s=await f.getDoc(f.doc(X.db,'tq',String(t.id)));if(s.exists()){qs=JSON.parse(s.data().qs);idbSet(String(t.id),qs)}}
  catch(e){if(e.code==='permission-denied'){if(needPay(t))payOpen(t.id);else toast('🔒 This test is not unlocked for you yet.');return false}}}
 if(!qs)qs=await idbGet(String(t.id));
 if(!qs||!qs.length){toast('Could not load this test. Check your internet.');return false}
 TQC[t.id]=qs;admtApply();return true}
const tqSig=t=>(payOpts(t).length>0?1:0)+':'+payKeys(t).join(',');

 await f.setDoc(f.doc(X.db,'tq',String(t.id)),{qs:JSON.stringify(t.qs),n:t.qs.length,keys:payKeys(t),paid:o,at:Date.now()});TQC[t.id]=t.qs;TQI[t.id]=tqSig(t);tqiSave();return true}catch(e){console.warn('tqPut',e);return false}}
function tqStrip(){const f=t=>{if(t&&t.qs&&t.qs.length&&(t.id in TQI)){TQC[t.id]=TQC[t.id]||t.qs;t.n=t.qs.length;t.qs=[]}};ADMT.add.forEach(f);Object.values(ADMT.edit).forEach(f)}

async function tqMigrate(){if(!ADM||TQBUSY)return;const todo=TESTS.filter(t=>hasQ(t)&&!(t.id in TQI));
 if(!todo.length&&!confirm('All tests are already on cloud. Re-sync payment access only?'))return;
 if(todo.length&&!confirm(todo.length+' tests will be sent to the cloud. Questions of admin-added tests will then be removed from the main document. Continue?'))return;
 TQBUSY=true;const bt=$('tqBtn');let ok=0;
 try{for(const t of todo){if(bt)bt.textContent='Sending '+(ok+1)+' / '+todo.length+'…';if(!(await tqPut(t))){alert('Failed at: '+t.t+'\nCheck internet / Firestore rules (tq).');TQBUSY=false;tqUi();return}ok++}
  const X=await fbInit(),f=X.f,s=await f.getDocs(f.query(f.collection(X.db,'pay'),f.where('st','==','a')));
  for(const d of s.docs){const p=d.data();if(p.uid&&p.key)for(const k of(p.ks||[p.key]))await f.setDoc(f.doc(X.db,'users',p.uid,'ent',k),{at:Date.now()})}
  tqStrip();tqiSave();admtSave();toast('✅ '+ok+' tests sent to cloud')}
 catch(e){alert('Error: '+(e.code||e.message))}
 TQBUSY=false;tqUi()}
const tqStat=()=>{const n=Object.keys(TQI).length,tot=TESTS.length;return n+' / '+tot+' tests on cloud'};
function tqUi(){const b=$('tqBtn');if(b)b.textContent='☁️ Send tests to cloud';const s=$('tqSt');if(s)s.textContent=tqStat()}
const tqCard=()=>`<div class="admin-card"><div class="admin-card-row"><div class="admin-icon" style="background:#E6EFFF">☁️</div><div class="admin-main"><b>Tests on cloud</b><span id="tqSt">${tqStat()}</span></div></div><div style="font-size:12px;color:#6B7694;margin:2px 0 8px">Sends questions of tests that are not on the cloud yet. Safe to press again anytime.</div><div class="admin-actions"><button class="admin-mini primary" id="tqBtn" onclick="tqMigrate()">☁️ Send tests to cloud</button></div></div>`;

function contactAcc(){return chBtn()+contactAcc0()}
function contactAcc0(){const C=CONTACT;if(!(C.name||C.phone||C.whatsapp||C.email))return'<p class="acc-text">📞 Coming Soon. Contact details will be added here soon.</p>';
 const d=v=>String(v||'').replace(/\D/g,'');

 <div class="acc-btns">${C.phone?`<a class="call" href="tel:+91${d(C.phone)}">📞 Call</a>`:''}${C.whatsapp?`<a class="wa" target="_blank" rel="noopener" href="https://wa.me/${d(C.whatsapp)}">💬 WhatsApp</a>`:''}${C.email?`<a class="mail" href="mailto:${esc(C.email)}">✉️ Email</a>`:''}</div>`}

/* ===== THEME (mode + color) ===== */
const THEMES=[
 {id:'blue',n:'Ocean Blue',l:'#1558D6',d:'#5B93FF',t:'#E6EFFF'},
 {id:'violet',n:'Teams Violet',l:'#6C5CE7',d:'#8F82FF',t:'#ECE9FF'},
 {id:'orchid',n:'Orchid',l:'#B04DDB',d:'#CB74F0',t:'#F6E7FC'},
 {id:'rose',n:'Rose',l:'#E04A68',d:'#FF7189',t:'#FFE6EB'},
 {id:'orange',n:'Sunset',l:'#EE7A22',d:'#FFA056',t:'#FFEEDD'},
 {id:'green',n:'Emerald',l:'#10A06B',d:'#34D399',t:'#DDF5E8'}];
const BGS=[['def','Default','#F6F8FD','#15162B'],['sky','Sky','#EAF3FF','#0B1E33'],['mint','Mint','#E7F7EF','#0B2420'],['lav','Lavender','#F1ECFF','#1E1230'],['peach','Peach','#FFF0E4','#2A1810'],['rose','Rose','#FFE8EF','#2A1220'],['sand','Sand','#F6F1E7','#1C1A14'],['slate','Slate','#E9EDF3','#10141C'],['black','Black','#F6F8FD','#000000']];
let TH={mode:'light',color:'blue',bg:'def'};
try{const x=JSON.parse(localStorage.getItem('urooj_theme')||'null');if(x&&x.mode)TH.mode=x.mode;if(x&&THEMES.some(t=>t.id===x.color))TH.color=x.color;if(x&&BGS.some(b=>b[0]===x.bg))TH.bg=x.bg}catch(e){}
function isDark(){return TH.mode==='dark'||(TH.mode==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)}
function applyTheme(){
 const r=document.documentElement,t=THEMES.find(x=>x.id===TH.color)||THEMES[0],d=isDark();
 r.setAttribute('data-mode',d?'dark':'light');r.setAttribute('data-color',t.id);
 r.style.setProperty('--p',d?t.d:t.l);
 r.style.setProperty('--pl',t.l);r.style.setProperty('--tintl',t.t);
 r.style.setProperty('--tint',d?`color-mix(in srgb,${t.d} 22%,#23253F)`:t.t);
 let m=document.querySelector('meta[name=theme-color]');if(!m){m=document.createElement('meta');m.name='theme-color';document.head.appendChild(m)}
 const bg=BGS.find(x=>x[0]===TH.bg)||BGS[0];if(bg[0]==='def')r.style.removeProperty('--bg');else r.style.setProperty('--bg',d?bg[3]:bg[2]);
 m.content=bg[0]==='def'?(d?'#15162B':'#F6F8FD'):(d?bg[3]:bg[2]);
 document.querySelectorAll('.bbtn').forEach(b=>b.classList.toggle('sel',b.dataset.b===TH.bg));
 document.querySelectorAll('.mbtn').forEach(b=>b.classList.toggle('sel',b.dataset.m===TH.mode));
 document.querySelectorAll('.cbtn').forEach(b=>b.classList.toggle('sel',b.dataset.c===TH.color));
}
function saveTheme(){try{localStorage.setItem('urooj_theme',JSON.stringify(TH))}catch(e){}}
function setMode(m){TH.mode=m;saveTheme();applyTheme()}
function setColor(c){TH.color=c;saveTheme();applyTheme()}
function setBg(b){TH.bg=b;saveTheme();applyTheme()}
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(TH.mode==='auto')applyTheme()})}catch(e){}
applyTheme();
function themeBody(){
 return`<div class="tp-l">Mode</div><div class="mrow">${[['light','☀️','Light'],['dark','🌙','Night'],['auto','🌓','Auto']].map(([id,e,l])=>`<button class="mbtn ${TH.mode===id?'sel':''}" data-m="${id}" onclick="setMode('${id}')"><b>${e}</b>${l}</button>`).join('')}</div>
 <div class="tp-l">Color theme</div><div class="crow">${THEMES.map(t=>`<button class="cbtn ${TH.color===t.id?'sel':''}" data-c="${t.id}" onclick="setColor('${t.id}')" aria-label="${t.n}"><i style="background:linear-gradient(135deg,${t.l},${t.d})"></i>${t.n}</button>`).join('')}</div>
 <div class="tp-l">Background</div><div class="crow">${BGS.map(b=>`<button class="cbtn bbtn ${TH.bg===b[0]?'sel':''}" data-b="${b[0]}" onclick="setBg('${b[0]}')" aria-label="${b[1]}"><i style="background:linear-gradient(135deg,${b[2]} 50%,${b[3]} 50%);border:1.5px solid var(--line);box-sizing:border-box"></i>${b[1]}</button>`).join('')}</div>`}

<script>
/* Content protection: screenshot ko poori tarah rokna browser/HTML se possible nahi hai.
   Ye layer copy/print/inspect ko mushkil banati hai.
   Asli screenshot-block ke liye app ko Android WebView mein wrap karke FLAG_SECURE lagayein. */
(function(){
 const app=()=>document.getElementById('app');
 let hold=false;
 const hide=()=>{const a=app();a&&a.classList.add('hide')};
 const show=()=>{const a=app();a&&a.classList.remove('hide')};
 document.addEventListener('visibilitychange',()=>document.hidden?hide():show());
 /* FIX: window blur par screen blur hota tha (link/PDF open, dialog, notification bar) aur kabhi wapas saaf nahi hota tha.
    Ab sirf tab chhodne/app background me jane par blur hota hai; touch/focus/timer par turant saaf. */
 window.addEventListener('focus',show);
 ['pointerdown','touchstart','click','scroll','keydown'].forEach(t=>document.addEventListener(t,()=>{if(!document.hidden&&!hold)show()},{passive:true,capture:true}));
 setInterval(()=>{if(!document.hidden&&!hold)show()},1000);
 window.addEventListener('pagehide',hide);window.addEventListener('pageshow',show);
 const ok=e=>/^(INPUT|TEXTAREA)$/.test((e.target||{}).tagName||'');
 ['contextmenu','dragstart'].forEach(t=>document.addEventListener(t,e=>{if(!ok(e))e.preventDefault()}));
 ['copy','cut'].forEach(t=>document.addEventListener(t,e=>{if(!ok(e))e.preventDefault()}));
 document.addEventListener('keydown',e=>{
  const k=(e.key||'').toLowerCase(),c=e.ctrlKey||e.metaKey;
  if(k==='printscreen'){try{navigator.clipboard.writeText('')}catch(x){}hold=true;hide();setTimeout(()=>{hold=false;show()},1500);e.preventDefault()}
  if(k==='f12'||(c&&['p','s','u'].includes(k))||(c&&e.shiftKey&&['i','j','c','s'].includes(k))||(e.metaKey&&e.shiftKey&&['3','4','5'].includes(k)))e.preventDefault();
 });
})();
</script>
