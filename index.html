<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact Directory Pro</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--fg:#17191c;--mute:#707780;--line:#e6e9ef;--wa:#128c4a;--call:#1f4fd8;--accent:#6c4ce6;--danger:#d83a3a;--shadow:0 6px 20px rgba(20,30,50,.07)}
:root[data-theme=dark]{--bg:#111315;--card:#1a1d20;--fg:#f1f3f5;--mute:#a6adb5;--line:#2a2f34;--wa:#45d987;--call:#7da3ff;--accent:#987cff;--danger:#ff6b6b;--shadow:0 6px 20px #0004}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:auto;padding:72px 14px 48px}h1{font-size:28px;margin:0}.sub{color:var(--mute);font-size:13px;margin:4px 0 16px}
.search-wrap{position:relative}.search{width:100%;padding:14px 45px 14px 42px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--fg);font:inherit;outline:none;box-shadow:var(--shadow)}.search-icon{position:absolute;left:14px;top:12px;font-size:20px;opacity:.7}.clear-search{position:absolute;right:9px;top:8px;width:34px;height:34px;border:0;border-radius:50%;background:transparent;color:var(--mute);font-size:20px;display:none}
.toolbar,.filters{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.toolbar button,.file-label,.filters select{padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font:600 12px inherit;cursor:pointer}.primary{background:var(--accent)!important;color:#fff!important;border-color:var(--accent)!important}input[type=file]{display:none}
.stats{display:flex;gap:8px;overflow:auto;margin:10px 0}.stat{min-width:105px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--card)}.stat b{display:block;font-size:18px}.stat span{font-size:11px;color:var(--mute)}
ul{list-style:none;margin:0;padding:0}li{padding:13px;border:1px solid var(--line);border-radius:14px;background:var(--card);box-shadow:var(--shadow);margin:8px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.who{min-width:0;flex:1}.avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;background:var(--bg);border:1px solid var(--line);flex-shrink:0}.avatar-fallback{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--accent);font-weight:800;font-size:18px;flex-shrink:0}.name{font-weight:700;overflow-wrap:anywhere}.num,.meta{font-size:12px;color:var(--mute)}.meta{margin-top:3px}.badge{display:inline-block;padding:2px 7px;border-radius:20px;background:var(--bg);color:var(--accent);margin-left:4px}.act{display:flex;gap:6px;flex-shrink:0}a.b{padding:7px 9px;border:1px solid currentColor;border-radius:9px;font-size:12px;font-weight:650;text-decoration:none;white-space:nowrap}a.c{color:var(--call)}a.w{color:var(--wa)}.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.tools button{padding:6px 8px;font-size:11px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--fg)}.tools .danger{color:var(--danger)}.empty{display:none;text-align:center;padding:30px;color:var(--mute)}
dialog{width:min(94vw,480px);border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--fg);padding:0;box-shadow:0 20px 70px #0007}dialog::backdrop{background:#0007}.modal{padding:20px}.modal h2{margin:0 0 14px}.modal label{display:block;font-size:12px;font-weight:700;margin:10px 0 5px}.modal input,.modal textarea,.modal select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);font:inherit}.modal textarea{min-height:80px}.actions{display:flex;justify-content:flex-end;gap:7px;margin-top:15px}
@media(max-width:480px){main{padding:68px 11px 48px}.row{align-items:flex-start}.act{flex-direction:column}a.b{min-width:70px;text-align:center}}
.profile-backdrop{position:fixed;inset:0;background:#0009;z-index:11000;display:flex;align-items:center;justify-content:center;padding:14px}.profile-card{width:min(92vw,380px);background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:24px;padding:24px 18px;box-shadow:0 24px 80px #0008;text-align:center;position:relative}.profile-close{position:absolute;right:12px;top:12px;width:36px;height:36px;border:0;border-radius:50%;background:var(--bg);color:var(--fg);font-size:22px;cursor:pointer}.profile-photo{width:130px;height:130px;border-radius:50%;object-fit:cover;border:2px solid var(--line);background:var(--bg);margin:10px auto 16px;display:block}.profile-fallback{width:130px;height:130px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--accent);font-size:48px;font-weight:800;margin:10px auto 16px;border:2px solid var(--line)}.profile-name{font-size:22px;font-weight:800;overflow-wrap:anywhere}.profile-number{font-size:15px;color:var(--mute);margin-top:5px}.profile-share{margin-top:20px;width:100%;padding:12px;border:0;border-radius:12px;background:var(--accent);color:#fff;font:700 14px inherit;cursor:pointer}.profile-share:active{transform:scale(.98)}

.corner-admin{position:fixed;top:12px;right:12px;z-index:9000;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);font:700 12px inherit;box-shadow:var(--shadow);cursor:pointer}.corner-admin:hover{transform:translateY(-1px)}.admin-backdrop{position:fixed;inset:0;background:#0009;z-index:10000;display:flex;align-items:center;justify-content:center;padding:14px}.admin-card{width:min(94vw,650px);max-height:90vh;overflow:auto;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 24px 80px #0008}.admin-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding-right:40px}.admin-icon{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--bg);font-size:23px}.admin-card h2{margin:0;font-size:21px}.admin-card .admin-note{margin:3px 0 0;color:var(--mute);font-size:12px}.admin-card input{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--bg);color:var(--fg);margin:5px 0 10px;outline:none}.admin-card input:focus{border-color:var(--accent)}.admin-actions{display:flex;gap:8px;justify-content:flex-end}.admin-log{border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin:8px 0;font-size:12px;background:var(--bg)}.admin-log b{display:block;font-size:13px;margin-bottom:3px}.admin-log .actor{display:inline-block;margin-top:6px;padding:3px 7px;border-radius:20px;background:var(--card);color:var(--accent);font-weight:700}.admin-close{position:absolute;right:15px;top:14px;border:0;border-radius:50%;width:36px;height:36px;font-size:21px;background:var(--bg);color:var(--fg);cursor:pointer}.admin-card{position:relative}.admin-tabs{display:flex;gap:7px;margin:12px 0;flex-wrap:wrap}.admin-tabs button{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);font-weight:700;cursor:pointer}.admin-summary{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}.admin-stat{padding:11px;border:1px solid var(--line);border-radius:13px;background:var(--bg)}.admin-stat b{display:block;font-size:18px}.admin-stat span{font-size:11px;color:var(--mute)}@media(max-width:480px){.corner-admin{top:8px;right:8px;padding:8px 10px}.admin-card{padding:16px}.admin-summary{grid-template-columns:1fr 1fr}}

#importContactsBtn,#mineBtn,label[for=restoreInput],.sidebar-item[data-action=import],.sidebar-item[data-action=restore],.sidebar-item[data-action=mine]{display:none!important}
body:not(.is-admin) #backupBtn,body:not(.is-admin) .sidebar-item[data-action=backup]{display:none!important}
</style></head>
<body><button id="adminBtn" class="corner-admin" title="Admin Login">🔐 Admin Login</button><main>
<h1>Contact Directory</h1><p class="sub">Smart Search • Hidden alternate names • Favorites • Backup</p>
<div class="search-wrap"><span class="search-icon">⌕</span><input id="search" class="search" type="search" placeholder="नाम, नंबर या hidden name खोजें..." autocomplete="off"><button id="clear" class="clear-search">×</button></div>
<div class="toolbar"><button id="allBtn">All Contacts</button><button id="favBtn">⭐ Favorites</button><button id="mineBtn">My Contacts</button><button id="addBtn" class="primary">＋ Add Contact</button><button id="themeBtn">🌙 Theme</button><button id="govBtn">🏛️ Government Employees</button></div>
<div class="toolbar"><button id="importContactsBtn">📥 Import Contacts</button><button id="backupBtn">💾 Backup</button><label class="file-label" for="restoreInput">♻️ Restore</label><input id="restoreInput" type="file" accept=".json,application/json"></div>
<div class="stats"><div class="stat"><b id="totalStat">0</b><span>Total</span></div><div class="stat"><b id="favStat">0</b><span>Favorites</span></div><div class="stat"><b id="aliasStat">0</b><span>Hidden names</span></div></div>
<div class="filters"><select id="sort"><option value="relevance">Smart order</option><option value="name">Name A–Z</option><option value="recent">Recently added</option><option value="favorite">Favorites first</option></select></div>
<div id="count" class="sub"></div><ul id="list"></ul><div id="empty" class="empty">Koi contact nahi mila.</div>

<section id="sidebarSection" hidden aria-live="polite">
  <h2 id="sidebarSectionTitle"></h2>
  <p id="sidebarSectionSub" class="section-sub"></p>
  <div id="sidebarSectionBody"></div>
</section>
</main>
<dialog id="dialog"><div class="modal"><h2 id="dialogTitle">Add Contact</h2><form id="form"><label>Name</label><input id="name" required><label>Mobile Number</label><input id="number" type="tel" required><input id="photo" type="file" style="display:none"><label>Notes</label><textarea id="notes" placeholder="Extra information..."></textarea><div class="actions"><button type="button" id="cancel">Cancel</button><button class="primary" type="submit">Save</button></div></form></div></dialog>
<script>
const INITIAL=[{"id": 1, "name": "❤️فیضان جلال🖤", "number": "+91 80581 12966", "aliases": [], "nameCounts": {"❤️فیضان جلال🖤": 1}, "favorite": false, "category": "Other", "notes": "", "owner": "demo", "deleted": false, "updatedAt": 0}, {"id": 2, "name": "Afjal Khan 👑افضل کھان👑", "number": "+91 78499 51879", "aliases": [], "nameCounts": {"Afjal Khan 👑افضل کھان👑": 1}, "favorite": false, "category": "Other", "notes": "", "owner": "demo", "deleted": false, "updatedAt": 0}, {"id": 3, "name": "Aakib Baig", "number": "+91 75688 19787", "aliases": [], "nameCounts": {"Aakib Baig": 1}, "favorite": false, "category": "Other", "notes": "", "owner": "demo", "deleted": false, "updatedAt": 0}, {"id": 4, "name": "Aakib Khan", "number": "+91 97723 51629", "aliases": [], "nameCounts": {"Aakib Khan": 1}, "favorite": false, "category": "Other", "notes": "", "owner": "demo", "deleted": false, "updatedAt": 0}, {"id": 5, "name": "Faizan", "number": "+91 83065 39220", "aliases": [], "nameCounts": {"Faizan": 1}, "favorite": false, "category": "Other", "notes": "", "owner": "demo", "deleted": false, "updatedAt": 0}, {"id": 6, "name": "Kasim", "number": "+91 76889 21573", "aliases": [], "nameCounts": {"Kasim": 1}, "favorite": false, "category": "Other", "notes": "", "owner": "demo", "deleted": false, "updatedAt": 0}, {"id": 7, "name": "Mohammed Aasim", "number": "+91 93514 52347", "aliases": [], "nameCounts": {"Mohammed Aasim": 1}, "favorite": false, "category": "Other", "notes": "", "owner": "demo", "deleted": false, "updatedAt": 0}, {"id": 8, "name": "Salim", "number": "+91 97998 94490", "aliases": [], "nameCounts": {"Salim": 1}, "favorite": false, "category": "Other", "notes": "", "owner": "demo", "deleted": false, "updatedAt": 0}, {"id": 9, "name": "Shahbaz", "number": "+91 96607 40637", "aliases": [], "nameCounts": {"Shahbaz": 1}, "favorite": false, "category": "Other", "notes": "", "owner": "demo", "deleted": false, "updatedAt": 0}, {"id": 10, "name": "Soeb", "number": "+91 97728 31837", "aliases": [], "nameCounts": {"Soeb": 1}, "favorite": false, "category": "Other", "notes": "", "owner": "demo", "deleted": false, "updatedAt": 0}, {"id": 11, "name": "Yaqeen", "number": "+91 88905 40723", "aliases": [], "nameCounts": {"Yaqeen": 1}, "favorite": false, "category": "Other", "notes": "", "owner": "demo", "deleted": false, "updatedAt": 0}];
const KEY='contact_directory_pro_v5';
const LOGKEY='contact_directory_activity_v1';
let activity=JSON.parse(localStorage.getItem(LOGKEY)||'[]');
function logAction(action,details='',actor='Local User'){activity.unshift({time:new Date().toISOString(),actor,action,details});activity=activity.slice(0,1000);localStorage.setItem(LOGKEY,JSON.stringify(activity))}
let contacts=[],mode='all',editingId=null;
const $=id=>document.getElementById(id),digits=s=>String(s||'').replace(/\D/g,''),norm=s=>String(s||'').toLocaleLowerCase('hi').normalize('NFKD').replace(/[\u064B-\u065F\u0670]/g,'').replace(/[^\p{L}\p{N}]/gu,'');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function save(){try{localStorage.setItem('cd_fav_ids_v1',JSON.stringify(contacts.filter(c=>c.favorite).map(c=>String(c.id))))}catch(e){}}
function clean(c){c.aliases=c.aliases||[];c.nameCounts=c.nameCounts||{[c.name]:1};c.favorite=!!c.favorite;c.notes=c.notes||'';c.photo=c.photo||'';c.owner=c.owner||'mine';c.deleted=!!c.deleted;c.updatedAt=c.updatedAt||Date.now();return c}
window.getContacts=()=>contacts;window.setContacts=a=>{contacts=a.map(clean);render()};window.INITIAL_DATA=INITIAL;
function bestName(c){const x={...c.nameCounts};if(!x[c.name])x[c.name]=1;return Object.entries(x).sort((a,b)=>b[1]-a[1])[0][0]}
function allNames(c){return [...new Set([c.name,...(c.aliases||[]),...Object.keys(c.nameCounts||{})])]}
function match(c,q){if(!q.trim())return true;const n=norm(q);return [c.number,c.notes,...allNames(c)].map(norm).some(v=>v.includes(n))}
function score(c,q){if(!q.trim())return c.favorite?-1:0;const n=norm(q),b=norm(bestName(c)),ns=allNames(c).map(norm),num=norm(c.number);if(b===n||ns.includes(n)||num===n)return -3;if(b.startsWith(n)||ns.some(x=>x.startsWith(n))||num.startsWith(n))return -2;return 0}
function render(){
 const q=$('search').value,sort=$('sort').value;
 let arr=contacts.filter(c=>!c.deleted&&match(c,q));
 if(mode==='fav')arr=arr.filter(c=>c.favorite);if(mode==='mine')arr=arr.filter(c=>c.owner==='mine');
 arr.sort((a,b)=>sort==='name'?cName(a).localeCompare(cName(b),'hi'):sort==='recent'?b.updatedAt-a.updatedAt:sort==='favorite'?Number(b.favorite)-Number(a.favorite)||cName(a).localeCompare(cName(b),'hi'):score(a,q)-score(b,q)||Number(b.favorite)-Number(a.favorite));
 $('list').innerHTML=arr.map(c=>{
  const phone=digits(c.number),name=cName(c),initial=esc(name.trim().charAt(0)||'👤');
  const avatar=c.photo?`<img class="avatar" src="${c.photo}" alt="">`:`<div class="avatar-fallback">${initial}</div>`;
  return `<li onclick="openProfile('${c.id}')" style="cursor:pointer"><div class="row"><div class="who" style="display:flex;gap:11px;align-items:center">${avatar}<div style="min-width:0;flex:1"><div class="name">${esc(name)} ${c.favorite?'⭐':''}</div><div class="num">${esc(c.number)}</div>${c.notes?`<div class="meta">📝 ${esc(c.notes)}</div>`:''}</div></div><div class="act"><a class="b c" href="tel:+${phone}" onclick="event.stopPropagation()">Call</a><a class="b w" href="https://wa.me/${phone}" onclick="event.stopPropagation()">WhatsApp</a></div></div><div class="tools"><button onclick="event.stopPropagation();toggleFav('${c.id}')">${c.favorite?'★ Unfavorite':'☆ Favorite'}</button><button onclick="event.stopPropagation();editContact('${c.id}')">${window.__admin?'✏️ Edit':'✏️ सुधार भेजें'}</button>${window.__admin?`<button onclick="event.stopPropagation();deleteContact('${c.id}')" class="danger">🗑️ Delete</button>`:''}</div></li>`;
 }).join('');
 $('empty').style.display=arr.length?'none':'block';$('count').textContent=arr.length+' contact'+(arr.length===1?'':'s');
 $('totalStat').textContent=contacts.filter(c=>!c.deleted).length;$('favStat').textContent=contacts.filter(c=>!c.deleted&&c.favorite).length;$('aliasStat').textContent=contacts.filter(c=>!c.deleted).reduce((n,c)=>n+(c.aliases||[]).length,0);$('clear').style.display=q?'block':'none';
}
function cName(c){return c.name||bestName(c)}
window.openProfile=id=>{
 const c=contacts.find(x=>String(x.id)===String(id)); if(!c)return;
 const old=document.getElementById('profileModal'); if(old)old.remove();
 const name=cName(c), photo=c.photo||'';
 const avatar=photo?`<img class="profile-photo" src="${photo}" alt="Profile photo">`:`<div class="profile-fallback">${esc((name||'👤').trim().charAt(0)||'👤')}</div>`;
 const box=document.createElement('div'); box.id='profileModal';
 box.innerHTML=`<div class="profile-backdrop"><div class="profile-card"><button class="profile-close" id="profileClose">×</button>${avatar}<div class="profile-name">${esc(name)}</div><div class="profile-number">${esc(c.number)}</div><button class="profile-share" id="profileShare">📤 Share Contact</button></div></div>`;
 document.body.appendChild(box);
 const close=()=>box.remove();
 box.querySelector('#profileClose').onclick=close;
 box.querySelector('.profile-backdrop').onclick=e=>{if(e.target.classList.contains('profile-backdrop'))close()};
 box.querySelector('#profileShare').onclick=async()=>{
   const text=`${name}\n${c.number}`;
   try{
     if(navigator.share){await navigator.share({title:name,text});logAction('Contact shared',name+' | '+c.number)}
     else if(navigator.clipboard){await navigator.clipboard.writeText(text);alert('Contact details copy हो गए हैं।')}
     else{prompt('Contact details copy करें:',text)}
   }catch(err){}
 };
};

window.toggleFav=id=>{const c=contacts.find(x=>String(x.id)===String(id));if(c){c.favorite=!c.favorite;logAction(c.favorite?'Favorite added':'Favorite removed',c.name); c.updatedAt=Date.now();save();render()}};
window.editContact=id=>{const c=contacts.find(x=>String(x.id)===String(id));if(!c)return;editingId=c.id;$('dialogTitle').textContent='Edit Contact';$('name').value=c.name;$('number').value=c.number;$('photo').value='';$('notes').value=c.notes;$('dialog').showModal()};
window.deleteContact=async id=>{const c=contacts.find(x=>String(x.id)===String(id));if(window.__admin&&c&&confirm('Delete "'+c.name+'"?')){try{await fb.remove(id)}catch(e){alert('हटाया नहीं जा सका।')}}};
window.showNames=id=>{const c=contacts.find(x=>String(x.id)===String(id));if(c)alert('Number: '+c.number+'\n\nName usage:\n'+Object.entries(c.nameCounts||{}).sort((a,b)=>b[1]-a[1]).map(x=>x[0]+' — '+x[1]).join('\n')+'\n\nAlternate names: '+(c.aliases||[]).join(', '))};
$('addBtn').onclick=()=>{logAction('Add Contact window opened');editingId=null;$('dialogTitle').textContent='Add Contact';$('form').reset();$('photo').value='';$('dialog').showModal()};
$('cancel').onclick=()=>$('dialog').close();
$('form').onsubmit=async e=>{e.preventDefault();const name=$('name').value.trim(),number=$('number').value.trim(),notes=$('notes').value.trim();
 if(!name||digits(number).length<10){alert('सही नाम और मोबाइल नंबर लिखिए।');return}
 try{if(window.__admin)await fb.save(editingId,name,number,notes);else{await fb.request(editingId,name,number,notes);alert('अनुरोध भेज दिया गया है। Admin की मंज़ूरी के बाद सूची में दिखेगा।')}$('dialog').close()}catch(err){alert('भेजा नहीं जा सका। फिर कोशिश करें।')}};
$('search').oninput=render;$('clear').onclick=()=>{$('search').value='';render();$('search').focus()};$('sort').onchange=render;
$('allBtn').onclick=()=>{mode='all';render()};$('favBtn').onclick=()=>{mode='fav';render()};$('mineBtn').onclick=()=>{mode='mine';render()};
$('themeBtn').onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';localStorage.setItem('contact_theme',document.documentElement.dataset.theme)};if(localStorage.getItem('contact_theme'))document.documentElement.dataset.theme=localStorage.getItem('contact_theme');

function blobToDataURL(blob){return new Promise((resolve,reject)=>{if(!blob){resolve('');return}const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(blob)})}
async function importPhoneContacts(){
 if(!('contacts' in navigator && 'ContactsManager' in window)){
   alert('Is browser me direct phone Contacts import support nahi hai. Android Chrome ke supported version me try karein.'); return;
 }
 try{
   const props=['name','tel','icon'];
   const picked=await navigator.contacts.select(props,{multiple:true});
   let added=0,merged=0,photos=0;
   for(const item of picked){
     const name=(item.name||[])[0]?.trim()||'Unnamed Contact';
     const number=(item.tel||[])[0]?.trim()||'';
     const d=digits(number); if(!d) continue;
     let photo='';
     const icon=item.icon?.[0];
     if(icon) { try{photo=await blobToDataURL(icon); if(photo)photos++}catch{} }
     let c=contacts.find(x=>!x.deleted&&digits(x.number)===d);
     if(c){
       c.nameCounts=c.nameCounts||{}; c.nameCounts[name]=(c.nameCounts[name]||0)+1;
       c.aliases=c.aliases||[];
       if(norm(c.name)!==norm(name)&&!c.aliases.some(a=>norm(a)===norm(name))) c.aliases.push(name);
       if(photo)c.photo=photo; c.updatedAt=Date.now(); c.deleted=false; merged++;
     }else{
       contacts.push(clean({id:crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random(),name,number,aliases:[],nameCounts:{[name]:1},favorite:false,notes:'',photo,owner:'mine',deleted:false,updatedAt:Date.now()}));
       added++;
     }
   }

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,doc,addDoc,updateDoc,deleteDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const cfg={apiKey:"AIzaSyBD0FfG6eVmRtOzcvTWEnMkd5SiwOUHgJo",authDomain:"phone-directory-c4629.firebaseapp.com",projectId:"phone-directory-c4629",storageBucket:"phone-directory-c4629.firebasestorage.app",messagingSenderId:"843929684417",appId:"1:843929684417:web:dacef2cffe8e4ad6d84740"};
const app=initializeApp(cfg),db=getFirestore(app),auth=getAuth(app);
const C=()=>window.getContacts(),l10=x=>String(x||'').replace(/\D/g,'').slice(-10),nz=x=>String(x||'').toLowerCase().replace(/\s+/g,'');
const topName=(nc,cur)=>{const e=Object.entries(nc),m=Math.max(...e.map(x=>x[1]));return nc[cur]>=m?cur:e.find(x=>x[1]===m)[0]};
const favIds=()=>{try{return new Set(JSON.parse(localStorage.getItem('cd_fav_ids_v1')||'[]'))}catch(e){return new Set()}};
window.__admin=false;window.__reqs=[];
onSnapshot(collection(db,'contacts'),s=>{const f=favIds();window.setContacts(s.docs.map(d=>({...d.data(),id:d.id,favorite:f.has(d.id)})))},()=>{document.getElementById('empty').textContent='डेटा लोड नहीं हो पाया।';document.getElementById('empty').style.display='block'});
async function upsert(name,number,notes){
 const hit=C().find(x=>l10(x.number)===l10(number));
 if(hit){const nc={...(hit.nameCounts||{})};nc[name]=(nc[name]||0)+1;const al=[...(hit.aliases||[])];if(nz(hit.name)!==nz(name)&&!al.some(a=>nz(a)===nz(name)))al.push(name);
  await updateDoc(doc(db,'contacts',String(hit.id)),{nameCounts:nc,aliases:al,name:topName(nc,hit.name),notes:notes||hit.notes||'',updatedAt:Date.now()})}
 else await addDoc(collection(db,'contacts'),{name,number,notes:notes||'',aliases:[],nameCounts:{[name]:1},category:'Other',updatedAt:Date.now()})}
async function edit(id,name,number,notes){
 const c=C().find(x=>String(x.id)===String(id));if(!c)return upsert(name,number,notes);
 const nc={...(c.nameCounts||{})};nc[name]=Math.max(0,...Object.values(nc))+1;
 const al=[...new Set([...(c.aliases||[]),c.name])].filter(a=>nz(a)!==nz(name));
 await updateDoc(doc(db,'contacts',String(id)),{name,number,notes:notes||'',nameCounts:nc,aliases:al,updatedAt:Date.now()})}
window.fb={
 async request(id,name,number,notes){const r={type:id?'edit':'add',name:name.slice(0,79),number:number.slice(0,19),note:notes.slice(0,199),status:'pending',createdAt:Date.now()};if(id)r.targetId=String(id);await addDoc(collection(db,'requests'),r)},
 save:(id,name,number,notes)=>id?edit(id,name,number,notes):upsert(name,number,notes),
 remove:id=>deleteDoc(doc(db,'contacts',String(id))),
 login:(e,p)=>signInWithEmailAndPassword(auth,e,p),logout:()=>signOut(auth),
 async approve(r){if(r.type==='edit'&&r.targetId)await edit(r.targetId,r.name,r.number,r.note);else await upsert(r.name,r.number,r.note);await deleteDoc(doc(db,'requests',r.id))},
 reject:id=>deleteDoc(doc(db,'requests',id)),
 async seed(){for(const c of window.INITIAL_DATA)await addDoc(collection(db,'contacts'),{name:c.name,number:c.number,notes:'',aliases:[],nameCounts:{[c.name]:1},category:'Other',updatedAt:Date.now()})}
};
let unR=null;
onAuthStateChanged(auth,u=>{window.__admin=!!u;document.body.classList.toggle('is-admin',!!u);
 if(unR){unR();unR=null}window.__reqs=[];
 if(u)unR=onSnapshot(collection(db,'requests'),s=>{window.__reqs=s.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>b.createdAt-a.createdAt);dispatchEvent(new Event('reqschange'))});
 dispatchEvent(new Event('adminchange'));window.render()});
</script>
