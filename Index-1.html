<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Urooj Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap"></noscript>
<style>
:root{--p:#1558D6;--navy:#0B1F4B;--grey:#55607E;--bg:#F6F8FD;--line:#DDE5F5;--red:#C2264B}
*{box-sizing:border-box}
body{margin:0;background:#E9EEF9;font-family:'Plus Jakarta Sans','Noto Sans Devanagari',system-ui,sans-serif;color:var(--navy)}
button{font-family:inherit;cursor:pointer}
#app{max-width:430px;min-height:100vh;margin:0 auto;background:var(--bg);position:relative;padding-bottom:84px}
.pad{padding:20px 18px}
.hd{display:flex;align-items:center;gap:8px}.hd>div[style*="flex:1"]{min-width:0}.bellcol{display:flex;flex-direction:column;align-items:center;gap:2px;flex:none}.bellcol .device-clock{height:22px;min-width:50px;padding:0 8px;border-radius:11px;box-shadow:none}.bellcol .ib{height:40px}
.logo{font-size:20px;font-weight:800;line-height:1.1}.logo b{color:var(--p)}
.tag{font-size:12px;color:var(--grey);margin-top:2px}
.ib{width:44px;height:44px;border:0;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.ib.n{background:none}
.ban{margin-top:18px;border-radius:20px;background:#E6EFFF;padding:18px}
.ban h1{margin:0;font-size:22px;line-height:1.25;font-weight:800}.ban h1 span{color:var(--p)}
.ban p{margin:8px 0 0;font-size:12px;color:#4A5675;line-height:1.5;max-width:75%}
.sr{margin-top:16px;height:48px;border-radius:16px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 14px}
.sr input{border:0;outline:0;flex:1;font:inherit;font-size:13px;background:none;color:var(--navy)}
h2{font-size:16px;font-weight:700;margin:22px 0 0}
.cats{display:flex;justify-content:space-between;margin-top:12px}
.cat{width:62px;text-align:center;border:0;background:none;padding:0;color:var(--navy);font-size:11.5px;font-weight:600}
.cat i{display:flex;width:52px;height:52px;margin:0 auto 6px;border-radius:16px;align-items:center;justify-content:center;border:2px solid transparent}
.cat.on i{border-color:currentColor}
.card{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;margin-top:10px}
.ci{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none}
.card .t{font-size:13px;font-weight:700}.card .s{font-size:12px;color:var(--grey);margin-top:2px}.card .m{font-size:11.5px;color:var(--grey);margin-top:5px}
.btn{flex:none;height:44px;padding:0 14px;border:0;border-radius:22px;background:var(--p);color:#fff;font-size:12px;font-weight:700}
.btn.o{background:#fff;color:var(--p);border:1.5px solid var(--p)}
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:76px;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;border:0;background:none;color:var(--grey);font-size:11px;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tabs button.on{color:var(--p);font-weight:700}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.timer{font-weight:800;color:var(--p);font-size:15px}.timer.low{color:var(--red)}
.q{font-size:18px;font-weight:700;line-height:1.45;margin:18px 0}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;text-align:left;padding:12px;margin-bottom:10px;border-radius:14px;border:1.5px solid var(--line);background:#fff;color:var(--navy);font-size:14px}
.opt.on{border-color:var(--p);background:#E6EFFF}
.opt u{width:20px;height:20px;border-radius:50%;border:2px solid var(--grey);flex:none;text-decoration:none}
.opt.on u{border:6px solid var(--p)}
.nav{display:flex;gap:10px;margin-top:24px}.nav .btn{flex:1;height:48px;border-radius:24px;font-size:14px}
.res{text-align:center;padding-top:70px}.big{font-size:60px;font-weight:800;color:var(--p)}
.bar{height:10px;border-radius:5px;background:var(--line);margin-top:6px}.bar div{height:10px;border-radius:5px;background:var(--p)}
.mut{color:var(--grey);font-size:13px;margin-top:12px}
.ov{position:fixed;top:0;bottom:0;left:50%;width:100%;max-width:430px;transform:translateX(-50%);overflow:hidden;pointer-events:none;z-index:20}
.ov.open{pointer-events:auto}
.sh{position:absolute;inset:0;background:rgba(11,31,75,.45);opacity:0;transition:opacity .25s}
.ov.open .sh{opacity:1}
.dr{position:absolute;top:0;bottom:0;left:0;width:290px;max-width:84%;background:#fff;transform:translateX(-100%);transition:transform .25s ease;display:flex;flex-direction:column;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom)}
.ov.open .dr{transform:none}
.dh{background:var(--p);color:#fff;padding:28px 20px 20px}
.av{width:56px;height:56px;border-radius:50%;background:#DCE8FF;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.dh .nm{font-size:17px;font-weight:800}.dh .sb{font-size:12px;opacity:.9;margin-top:2px}
.dm{padding:12px}
.dm .lb{font-size:12px;font-weight:700;color:var(--grey);margin:14px 10px 6px}
.it{display:flex;align-items:center;gap:14px;width:100%;min-height:48px;border:0;background:none;border-radius:14px;padding:0 12px;font-size:14px;font-weight:600;color:var(--navy);text-align:left}
.it.on{background:#E6EFFF;color:var(--p)}
.it .dot{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.df{margin-top:auto;padding:16px 22px;font-size:11px;color:var(--grey);border-top:1px solid var(--line)}
.soon{text-align:center;padding:48px 20px}
.soon .em{font-size:56px;line-height:1}
.soon .h{font-size:20px;font-weight:800;margin-top:14px}
.soon .p{font-size:13px;color:var(--grey);margin-top:8px;line-height:1.5}
.pg h2{margin-top:0}.pg p{font-size:14px;line-height:1.7;color:#2B3858}
.subs{display:flex;gap:8px;margin-top:14px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;min-height:40px;padding:0 16px;border-radius:20px;border:1.5px solid var(--line);background:#fff;color:var(--navy);font-size:13px;font-weight:600}
.chip.on{background:var(--p);border-color:var(--p);color:#fff}
.board-switch{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.board-card{min-height:86px;border:1.5px solid var(--line);border-radius:18px;background:#fff;color:var(--navy);display:flex;align-items:center;gap:10px;padding:10px 12px;font:inherit;font-size:13px;font-weight:800;text-align:left}
.board-card.on{border-color:var(--p);background:#E6EFFF;color:var(--p);box-shadow:0 0 0 1px rgba(21,88,214,.08)}
.board-logo{width:54px;height:54px;border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;line-height:1}
.board-logo span{font-size:10px;font-weight:900;letter-spacing:.3px}
.board-logo small{font-size:6.5px;margin-top:5px;font-weight:700}
.rbse-logo{background:#FFF1D8;border:2px solid #C98B2E;color:#8A5A13}
.ncert-logo{background:#E8F1FF;border:2px solid #1558D6;color:#1558D6}

.pic{display:flex;flex-direction:column;align-items:center;margin:8px 0 18px}
.pic .ph{width:104px;height:104px;border-radius:50%;background:#DCE8FF;display:flex;align-items:center;justify-content:center;overflow:hidden;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.pic img,.av img{width:100%;height:100%;object-fit:cover}
.pic label{margin-top:12px;min-height:44px;display:flex;align-items:center;padding:0 18px;border-radius:22px;border:1.5px solid var(--p);color:var(--p);font-size:13px;font-weight:700;cursor:pointer}
.fld{margin-bottom:14px}.fld label{display:block;font-size:12px;font-weight:700;color:var(--grey);margin-bottom:6px}
.fld input{width:100%;height:48px;border-radius:14px;border:1.5px solid var(--line);background:#fff;padding:0 14px;font:inherit;font-size:14px;color:var(--navy)}
.fld input:focus{outline:0;border-color:var(--p)}
.err{color:var(--red);font-size:12px;margin-top:4px}
.ok{color:#0E7A4B;font-size:13px;font-weight:700;margin-top:12px;text-align:center}
.lg{display:flex;align-items:center;justify-content:space-between;padding:14px 12px 10px 18px;border-bottom:1px solid var(--line)}
.lg img{width:150px;height:auto;display:block}
.lg .x{background:#F1F4FB;border-radius:50%}
.pc{display:flex;align-items:center;gap:12px;width:calc(100% - 28px);margin:14px;border:0;border-radius:18px;background:var(--p);color:#fff;padding:12px;min-height:72px}
.pc .av{width:48px;height:48px;margin:0;flex:none;overflow:hidden}
.pc .nm{display:block;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .sb{display:block;font-size:12px;opacity:.92;margin-top:2px}
.dm{padding:0 14px 10px}
.dm .lb{font-size:12px;font-weight:700;color:var(--grey);margin:16px 8px 6px}
.it{transition:background .15s}.it:hover{background:#F1F4FB}.it.on:hover{background:#E6EFFF}
.it.on{font-weight:700}
.qb{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.qb .qh{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:8px}
.qb input[type=text]{width:100%;height:46px;border-radius:12px;border:1.5px solid var(--line);padding:0 12px;font:inherit;font-size:14px;color:var(--navy);background:#fff}
.qb input[type=text]:focus{outline:0;border-color:var(--p)}
.or{display:flex;align-items:center;gap:10px;margin-top:8px}
.or input[type=radio]{width:22px;height:22px;accent-color:var(--p);flex:none;margin:0}
.dl{width:44px;height:44px;border:0;border-radius:14px;background:#FFE3E8;display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.it .chev{margin-left:auto;font-size:22px;line-height:1;color:var(--grey);transition:transform .25s}
.it[aria-expanded=true] .chev{transform:rotate(90deg);color:var(--p)}
.it[aria-expanded=true]{background:#F1F4FB}
.acc{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease}
.acc.open{grid-template-rows:1fr}
.acc-in{overflow:hidden;min-height:0;padding:0 4px}
.acc.open .acc-in{padding:6px 4px 12px}
.acc-card{display:flex;gap:12px;align-items:center;padding:14px;border-radius:18px;border:1px solid var(--line);background:#F6F8FD}
.acc-av{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;background:var(--p);color:#fff;font-weight:800;font-size:19px}
.acc-who{display:flex;flex-direction:column;min-width:0}.acc-who b{font-size:15px}.acc-who span{font-size:12.5px;color:var(--grey);overflow-wrap:anywhere}
.acc-btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.acc-btns a,.acc-btns button{flex:1;min-height:40px;display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;padding:0 10px;border:0;border-radius:999px;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.acc-btns .call{background:#E6EFFF;color:#1558D6}.acc-btns .wa{background:#DDF5E8;color:#0E7A4B}.acc-btns .mail{background:#F1F4FB;color:#0B1F4B}
.acc-btns .cp{flex:0 1 auto;background:#F1F4FB;color:#0B1F4B;padding:0 14px}.acc-btns .cp.all{background:#E6EFFF;color:#1558D6}
.acc-text{font-size:13px;line-height:1.7;color:#2B3858;margin:4px 4px 0}
@media(prefers-reduced-motion:reduce){.acc,.chev{transition:none}}
.acc-btns .cp.sel{background:var(--p);color:#fff}
.qpl{font-size:12px;font-weight:700;color:var(--grey);margin:10px 4px 0}.qpl:first-child{margin-top:2px}
.acc-btns.pf a{flex:1 1 100%;justify-content:flex-start;padding:0 14px}
.qrow{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:44px;margin-top:6px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:#fff;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--navy);text-align:left}
.qrow.sel{background:#E6EFFF;border-color:var(--p);color:var(--p);font-weight:700}
.qrow .chev{font-size:20px;line-height:1;color:var(--grey);transition:transform .25s}
.qrow[aria-expanded=true] .chev{transform:rotate(90deg);color:var(--p)}
.qrow .chg{font-size:12px;font-weight:700}
.qlist{max-height:230px;overflow-y:auto}
.dr{width:250px;max-width:78%}
.cat i{position:relative}
.lk{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:#fff;border:1px solid var(--line);font-size:12px;display:flex;align-items:center;justify-content:center;font-style:normal}
.sw{flex:none;width:52px;height:30px;border-radius:15px;border:0;background:#C7CFE2;position:relative;padding:0;transition:background .2s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--red)}.sw.on::after{transform:translateX(22px)}.sw.g.on{background:#0E7A4B}
.rec-w{overflow:hidden;border-radius:18px}.rec-t{display:flex;transition:transform .5s ease}.rec-s{flex:0 0 100%;min-width:0}
.rec-d{display:flex;justify-content:center;gap:2px;margin-top:6px}.rec-b{width:22px;height:22px;border:0;background:none;padding:0;display:flex;align-items:center;justify-content:center}
.rec-b i{width:8px;height:8px;border-radius:4px;background:#C7CFE2;transition:width .3s,background .3s}.rec-b.on i{width:20px;background:var(--p)}
@media(prefers-reduced-motion:reduce){.rec-t,.rec-b i{transition:none}}
.pfs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.pfs div{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center}
.pfs b{display:block;font-size:20px;font-weight:800;color:var(--p)}.pfs span{font-size:11px;color:var(--grey);font-weight:600}
.pfc{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:10px}
.pfc svg{width:100%;height:auto;display:block}
.pfm{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pfm .ib{background:#F1F4FB}.pfm .ib:disabled{opacity:.35}
.pfm .mn{font-size:15px;font-weight:800;text-align:center;flex:1}
.pfn{font-size:12px;color:var(--grey);text-align:center;margin-top:6px}
.pfb{flex:none;min-width:64px;text-align:center;border-radius:14px;padding:6px 8px}.pfb b{display:block;font-size:16px;font-weight:800}.pfb span{font-size:11px;font-weight:700}
.pfr{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--navy);padding:6px 0;border-top:1px solid var(--line)}.pfr:first-of-type{border-top:0}
.pfr span{color:var(--grey)}
.tst{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);max-width:340px;width:calc(100% - 40px);background:var(--navy);color:#fff;font-size:13px;font-weight:600;line-height:1.4;padding:12px 16px;border-radius:14px;text-align:center;z-index:50}


a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none;white-space:nowrap}
button.card{width:100%;text-align:left;font:inherit;color:inherit}
/* ---------- CONTENT PROTECTION ---------- */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea{-webkit-user-select:text;user-select:text}
img{-webkit-user-drag:none;pointer-events:auto}
#app.hide{filter:blur(22px);pointer-events:none}
@media print{body{display:none!important}}
.device-clock{height:34px;min-width:58px;padding:0 9px;border:1px solid var(--line);border-radius:17px;background:#F7F9FC;color:#0B1F4B;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;box-shadow:0 3px 10px rgba(11,31,75,.06)}

/* ---------- UPDATE: font size, review, Hindi font ---------- */
.q{font-size:calc(18px*var(--fs,1))}
.opt{font-size:calc(14px*var(--fs,1))}
.fsr{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.fsb{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--grey)}
.fsb button{min-width:44px;height:38px;border-radius:19px;border:1.5px solid var(--line);background:#fff;color:var(--p);font:inherit;font-weight:800;font-size:14px}
.rvh{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;margin-bottom:4px}
.rvt{display:flex;align-items:center;gap:12px}.rvp{font-size:34px;font-weight:800;color:var(--p);line-height:1}
.rvn{font-size:12px;font-weight:700;color:var(--grey);flex:1;min-width:0}
.rcs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.rc{border:1.5px solid var(--line);border-radius:14px;background:#fff;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:54px;font-family:inherit}
.rc b{font-size:18px}.rc span{font-size:10.5px;font-weight:700}
.rc.a{color:var(--p)}.rc.g{color:#0E7A4B}.rc.r{color:var(--red)}.rc.s{color:var(--grey)}
.rc.on{border-width:2px}
.rc.a.on{background:#E6EFFF;border-color:var(--p)}.rc.g.on{background:#DDF5E8;border-color:#0E7A4B}.rc.r.on{background:#FFE3E8;border-color:var(--red)}.rc.s.on{background:#EEF1F8;border-color:var(--grey)}
.rq{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:12px}
.rq.s-ok{border-color:#9AD9B8}.rq.s-bad{border-color:#F0A3B4}
.rqh{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;color:var(--grey)}
.rb.s-ok{color:#0E7A4B}.rb.s-bad{color:var(--red)}
.rqt{font-size:calc(15px*var(--fs,1));font-weight:700;line-height:1.5;margin:8px 0 10px}
.ro{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;margin-top:6px;border-radius:12px;border:1.5px solid var(--line);font-size:calc(13.5px*var(--fs,1));line-height:1.45}
.ro .rm{flex:none;width:16px;font-weight:800}
.ro.c-ok{background:#DDF5E8;border-color:#0E7A4B;color:#085C37;font-weight:700}
.ro.c-bad{background:#FFE3E8;border-color:var(--red);color:#9B1B3B;font-weight:700}
.wt{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.wt img{width:210px;max-width:70%;height:auto;display:block;mix-blend-mode:multiply}
.sp{width:46px;height:46px;border:4px solid var(--line);border-top-color:var(--p);border-radius:50%;animation:spin 1s linear infinite;margin:28px 0 16px}
@keyframes spin{to{transform:rotate(360deg)}}
#splash{position:fixed;inset:0;z-index:99999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity .35s ease}
#splash.out{opacity:0;pointer-events:none}
#splash img{width:210px;max-width:70%;height:auto;display:block;mix-blend-mode:multiply}
@media(prefers-reduced-motion:reduce){#splash{transition:none}}
.wh{font-size:18px;font-weight:800;color:var(--navy)}.ws{font-size:13px;color:var(--grey);margin-top:6px}
.rx{margin-top:10px;padding:10px 12px;border-radius:12px;background:#FFF8E6;border:1px solid #F2DDA4;font-size:calc(13px*var(--fs,1));line-height:1.65;color:#5A4410}
.q,.rqt,.opt span,.ro span{white-space:pre-line}
.mt{margin:8px 0;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.mr{display:grid;grid-template-columns:1fr 1fr}
.mr span{padding:8px 10px;font-size:calc(14px*var(--fs,1));font-weight:600;line-height:1.4;border-bottom:1px solid var(--line)}
.mr span+span{border-left:1px solid var(--line)}
.mr:last-child span{border-bottom:0}

ध में कौन-सा कथन सही नहीं है?",["दादू की समाधि सांभर में बनी है","उन्हें राजस्थान का कबीर कहा जाता है","1585 में वे अकबर से मिलने फतेहपुर सीकरी गए","उन्होंने जाति-प्रथा और मूर्ति पूजा का विरोध किया"],0,"दादू ने सांभर में कुछ समय रहकर उपदेश दिए, पर उनका देहावसान 1603 में नरायणा में हुआ। शेष तीनों कथन पुस्तक के अनुसार सही हैं।"],["संतों से संबंधित कौन-सा युग्म सही सुमेलित नहीं है?",["राणाबाई – गुरु रामानंद","मावजी – बेणेश्वर धाम","लालदास – धोलीदूब","हरिदास – कापड़ोद"],0,"राणाबाई के गुरु चतुरदास थे, रामानंद नहीं। रामानंद धन्ना और पीपा के गुरु थे। शेष तीनों युग्म पुस्तक के अनुसार सही हैं।"]],"s":"RBSE कक्षा 10 · राजस्थान का इतिहास एवं कला संस्कृति"},{"min":35,"cat":"rbse","sub":{"rbse":"c10"},"s":"RBSE कक्षा 10 · राजस्थान का इतिहास एवं कला संस्कृति","id":206,"t":"Chapter 3 · उत्सव, त्योहार, मेले · Part-1","qs":[["गणगौर शब्द में ‘गण’ किसका प्रतीक है?",["शिव","पार्वती","गणेश","हनुमान"],0,"पुस्तक के अनुसार गण का अर्थ शिव और गौर का अर्थ गौरी यानी पार्वती है। इस पर्व में अविवाहित कन्याएँ अच्छे वर की और विवाहित स्त्रियाँ पति की लंबी आयु की कामना से ईसरजी (शिव) और गणगौर (पार्वती) की पूजा करती हैं। इसलिए पार्वती वाला विकल्प ‘गौर’ से जुड़ता है, ‘गण’ से नहीं, और गणेश या हनुमान का इस शब्द से संबंध नहीं है।"],["तीज का पर्व किस माह की शुक्ल तृतीया को मनाया जाता है?",["श्रावण","भाद्रपद","चैत्र","वैशाख"],0,"तीज वर्षा ऋतु का त्योहार है और पूरे राजस्थान में श्रावण शुक्ल तृतीया को मनाया जाता है। इस दिन कन्याएँ और नवविवाहिताएँ झूले डालकर गीत गाती हैं। भाद्रपद कृष्ण तृतीया को केवल बूँदी की कजली तीज मनाई जाती है, इसलिए वह सामान्य तीज की तिथि नहीं है। चैत्र में गणगौर और वैशाख में अक्षय तृतीया मनाई जाती है।"],["बूँदी में कजली तीज किस माह में मनाई जाती है?",["भाद्रपद","श्रावण","फाल्गुन","चैत्र"],0,"जहाँ पूरे राजस्थान में तीज श्रावण में मनाई जाती है, वहीं बूँदी में कजली तीज भाद्रपद कृष्ण तृतीया को मनाई जाती है। सजी हुई पालकियों में तीज की सवारी नवल सागर से शुरू होकर कुम्भा स्टेडियम तक पहुँचती है। श्रावण वाला विकल्प सामान्य तीज का है, इसलिए यहाँ सही नहीं है, और फाल्गुन तथा चैत्र का इस पर्व से संबंध नहीं बताया गया।"],["अक्षय तृतीया किस माह की शुक्ल तृतीया को मनाई जाती है?",["वैशाख","चैत्र","आषाढ़","कार्तिक"],0,"वैशाख शुक्ल तृतीया को अक्षय तृतीया कहा जाता है। इसे ऐसी शुभ तिथि माना जाता है जिसके लिए अलग से मुहूर्त देखने की जरूरत नहीं होती, इसीलिए इसे अबूझ सावा भी कहते हैं। चैत्र शुक्ल तृतीया को गणगौर का समापन होता है, इसलिए वह तिथि भ्रम पैदा करती है। आषाढ़ और कार्तिक का इस पर्व से कोई संबंध नहीं बताया गया।"],["गणगौर पर्व चैत्र कृष्ण प्रतिपदा से किस तिथि तक चलता है?",["चैत्र शुक्ल तृतीया","चैत्र शुक्ल पूर्णिमा","वैशाख प्रतिपदा","फाल्गुन पूर्णिमा"],0,"पुस्तक के अनुसार गणगौर होली के दूसरे दिन चैत्र कृष्ण प्रतिपदा से शुरू होकर चैत्र शुक्ल तृतीया तक चलता है। इसी अवधि में होली की राख की पिंडियों और जौ के अंकुरों की पूजा होती है। फाल्गुन पूर्णिमा होली की तिथि है, इसलिए वह आरंभ से पहले की तिथि है। चैत्र पूर्णिमा और वैशाख प्रतिपदा इस पर्व की सीमा नहीं हैं।"],["गणगौर पूजा में होली की राख से बनी पिंडियों के साथ किसके अंकुर पूजे जाते हैं?",["जौ","गेहूँ","बाजरा","तिल"],0,"पुस्तक में बताया गया है कि गणगौर पर होली की राख से बनी पिंडियों की जौ के अंकुरों के साथ पूजा की जाती है। कन्याएँ फूलों को कलश में सजाकर घर लाती हैं और गणगौर के गीत गाती हैं। गेहूँ, बाजरा और तिल जैसे अनाज अक्षय तृतीया की सात अनाज की पूजा में आते हैं, गणगौर के अंकुरों में नहीं।"],["कर्नल टॉड ने गणगौर की सवारी का रोचक वर्णन किस नगर के संदर्भ में किया है?",["उदयपुर","जयपुर","जोधपुर","कोटा"],0,"टॉड ने उदयपुर की गणगौर सवारी का वर्णन किया है, जिसमें सब जातियों की स्त्रियाँ, बच्चे और पुरुष गहनों और रंगीन कपड़ों में अटारियों से जुलूस देखते हैं। सवारी तोप और नगाड़ों की ध्वनि के साथ महल से निकलकर पिछोला झील के गणगौर घाट तक जाती है। जयपुर, जोधपुर और कोटा में भी यह पर्व धूमधाम से मनता है, पर टॉड का वर्णन उदयपुर का है।"],["उदयपुर में गणगौर की सवारी पिछोला झील के किस घाट पर पहुँचती है?",["गणगौर घाट","हनुमान घाट","अंबा घाट","दूध तलाई घाट"],0,"पुस्तक के अनुसार सवारी महल से तोप और नगाड़ों की ध्वनि के साथ पिछोला झील के गणगौर घाट पर पहुँचती है, जहाँ नौका विहार और आतिशबाजी के साथ समाप्त होती है। घाट का नाम पर्व के नाम से ही ाप्त होता है","गलत – कहावत का तीज से कोई संबंध नहीं"],0,"यह कथन सही है। तीज श्रावण शुक्ल तृतीया को आती है और कहावत बताती है कि त्योहारों का सिलसिला तीज से शुरू होकर चैत्र की गणगौर पर समाप्त होता है। चैत्र में गणगौर होती है, तीज नहीं, इसलिए दूसरा विकल्प गलत है। चक्र का अंत दीपावली पर बताना भी पुस्तक के विरुद्ध है।"],["निम्नलिखित में से कौन-सा कथन सही नहीं है?",["बाड़मेर की पत्थरमार होली में इलोजी की बारात खुशी के गीतों के साथ समाप्त होती है","भीनाय में कोड़ामार होली खेली जाती है","शेखावाटी में गिंदड़ नृत्य होता है","मेवाड़ में गेर नृत्य होता है"],0,"बाड़मेर की पत्थरमार होली में इलोजी की बारात निकलती है, जो बाद में रोने-बिलखने में बदल जाती है, इसलिए खुशी में समाप्त होने का कथन गलत है। बाकी तीनों कथन पुस्तक के अनुसार सही हैं। इस होली का उद्देश्य लोगों का मनोरंजन करना है, उसमें करुणा का पुट भी दिखता है।"],["निम्नलिखित में से कौन-सा युग्म सही सुमेलित नहीं है?",["नवरोज़ – ईसाई पर्व","गुड फ्राइडे – ईसाई पर्व","ईस्टर – ईसाई पर्व","क्रिसमस – ईसाई पर्व"],0,"पुस्तक के अनुसार नव वर्ष (1 जनवरी), ईस्टर, गुड फ्राइडे और क्रिसमस ईसाई समुदाय के प्रमुख पर्व हैं। नवरोज़ ईसाई पर्व नहीं है, यही अभ्यास प्रश्न का भी उत्तर है। इसलिए पहला युग्म सही सुमेलित नहीं है और बाकी तीनों युग्म सही हैं।"]]},{"min":35,"cat":"rbse","sub":{"rbse":"c10"},"s":"RBSE कक्षा 10 · राजस्थान का इतिहास एवं कला संस्कृति","id":207,"t":"Chapter 3 · उत्सव, त्योहार, मेले · Part-2","qs":[["भारत में ब्रह्माजी का एकमात्र पूजित मंदिर कहाँ है?",["पुष्कर (अजमेर)","कोलायत (बीकानेर)","आबू (सिरोही)","नाथद्वारा (राजसमंद)"],0,"पुस्तक के अनुसार पुष्कर में स्थित मंदिर भारत में ब्रह्माजी का एकमात्र मंदिर है जहाँ उनकी विधिवत पूजा होती है। इसके पीछे की पहाड़ी पर सावित्री का मंदिर भी है। कोलायत कपिल मुनि के मेले के लिए, आबू जैन मंदिरों के लिए और नाथद्वारा श्रीनाथजी के लिए जाने जाते हैं, इसलिए वे विकल्प गलत हैं।"],["देशनोक का करणी माता मंदिर किस नाम से प्रसिद्ध है?",["चूहों का मंदिर","ऊँटों का मंदिर","साँपों का मंदिर","मोरों का मंदिर"],0,"बीकानेर जिले की नोखा तहसील के देशनोक में बीकानेर के राठौड़ शासकों की कुलदेवी करणी माता का मंदिर है। न के तीन रत्न कहा गया है।"],["सीकर जिले का कौन-सा स्थान गोटा उद्योग के लिए प्रसिद्ध है?",["खंडेला","नेछवा","पिपराली","खोर"],0,"पुस्तक में खंडेला (सीकर) को गोटा उद्योग का प्रसिद्ध केंद्र बताया गया है। गोटा सूती ताने पर चाँदी के धागे का बाना बुनकर बनाई जाने वाली लेस है। नेछवा, पिपराली और खोर सीकर जिले के अन्य स्थान हैं, पर गोटा उद्योग के केंद्र के रूप में उनका उल्लेख नहीं है।"],["थेवा कला किस जिले से संबंधित है?",["प्रतापगढ़","उदयपुर","चूरू","झालावाड़"],0,"थेवा कला में काँच के बीच भारी सोने का काम किया जाता है और प्रतापगढ़ की यह कला पूरे देश में अपनी अलग पहचान रखती है। उदयपुर, चूरू और झालावाड़ इस कला के लिए पुस्तक में नहीं बताए गए हैं। नाथद्वारा चाँदी की तारकशी के लिए प्रसिद्ध है। नाथद्वारा की तारकशी एक अलग कला है, इसलिए उसे थेवा से न मिलाएँ।"],["बोरला आभूषण महिलाएँ शरीर के किस भाग पर पहनती हैं?",["सिर","नाक","कान","हाथ"],0,"सिर पर पहने जाने वाले आभूषण बोर, बोरला, शीशफूल, राखड़ी और टीका कहलाते हैं। बोरला माथे या सिर के बीच पहना जाता है। नाक के गहने नथ, बेसर, बारी आदि हैं, कान के कर्णफूल, पीपलपत्र और झुमका हैं, और हाथ के कड़ा, कंकण और गजरा हैं, इसलिए ये विकल्प गलत हैं।"],["महिलाओं द्वारा दाँतों के बीच सोने की कील लगवाना क्या कहलाता है?",["चूँप","बारी","बोरला","दामणा"],0,"पुस्तक के अनुसार दाँतों के बीच में सोने की कील लगाना चूँप कहलाता है। बारी नाक का, बोरला सिर का और दामणा उँगली में पहना जाने वाला आभूषण है। इसलिए ये तीनों विकल्प इस प्रश्न के संदर्भ में सही नहीं हैं। इसी अभ्यास प्रश्न का उत्तर भी पुस्तक में यही है, और दाँत पर सोना चढ़वाने को रखन कहते हैं।"],["दाँतों पर सोने की परत चढ़वाना क्या कहलाता है?",["रखन","चूँप","मुरकी","नजरिया"],0,"दाँतों को सोने से मढ़वाना रखन कहलाता है, जबकि दाँतों के बीच सोने की कील जड़वाने को चूँप कहते हैं। मुरकी ठोस सोने की कुडक को कहते हैं, जो बच्चों के कान में पहनाई जाती है। नजरिया बच्चों के गले का आभूषण है, जो बुरी नजर से बचाने के लिए पहनाया जाता है।"],["सर्दियों में रुई भरकर बनाया जाने वाला पुरुषों का वस्त्र कौन-सा था?",["अंगरखी","जामा","साफा","मोठड़ा"],0,"पुस्तक के अनुसार सर्दियों की अंगरखियाँ रुई भरकर बनाई जाती थीं। अंगरखी का प्रयोग प "},"qs":[["राजस्थानी चित्रकला की उत्पत्ति का समय पुस्तक में लगभग कब माना गया है?",["लगभग 1500 ई.","1060 ई.","1260 ई.","1700 ई."],0,"पुस्तक के अनुसार राजस्थानी चित्रकला की उत्पत्ति लगभग 1500 ई. मानी जा सकती है। 1060 ई. वह वर्ष है जब ‘ओघ निर्युक्ति वृत्ति’ जैसे सचित्र ग्रंथ रचे गए और 1260 ई. मेवाड़ के सबसे पुराने सचित्र ग्रंथ का वर्ष है, इसलिए वे शैली की उत्पत्ति का समय नहीं हैं।"],["राजस्थानी चित्रकला की जन्मभूमि किसे माना गया है?",["मेदपाट (मेवाड़)","मारवाड़","ढूंढाड़","हाड़ौती"],0,"पुस्तक में कहा गया है कि मेदपाट (मेवाड़) राजस्थानी चित्रकला की जन्मभूमि है, जो अजंता शैली से प्रभावित मानी गई है। प्रारंभ में इस पर जैन, गुजरात और अपभ्रंश शैलियों का असर रहा। मारवाड़, ढूंढाड़ और हाड़ौती बाद में विकसित चार शैली-समूहों में से हैं।"],["1916 में ‘राजपूत पेंटिंग’ पुस्तक में राजस्थानी चित्रकला का पहला वैज्ञानिक वर्गीकरण किसने प्रस्तुत किया?",["आनंद कुमार स्वामी","रायकृष्ण दास","डब्ल्यू.एच. ब्राउन","ओ.सी. गांगुली"],0,"आनंद कुमार स्वामी ने 1916 में अपनी पुस्तक ‘राजपूत पेंटिंग’ में पहला वैज्ञानिक वर्गीकरण दिया। ओ.सी. गांगुली और हैवेल ने भी इसे राजपूत चित्रकला कहा, जबकि रायकृष्ण दास ने इस नाम को अस्वीकार कर ‘राजस्थानी चित्रकला’ नाम दिया। बाकी विकल्प पुस्तक में दिए गए तथ्यों से मेल नहीं खाते, इसलिए सही उत्तर यही है।"],["‘बणी-ठणी’ का चित्र राजस्थान की किस चित्रशैली की विशेष पहचान है?",["किशनगढ़","जोधपुर","नाथद्वारा","बीकानेर"],0,"बणी-ठणी किशनगढ़ शैली की विशेष पहचान है, जिसे राधा के रूप में चित्रित किया गया। एरिक डिकिन्सन ने इसे ‘भारत की मोनालिसा’ कहा। जोधपुर, नाथद्वारा और बीकानेर शैलियों की अपनी अलग पहचान है, पर बणी-ठणी उनसे नहीं जुड़ी। बाकी विकल्प पुस्तक में दिए गए तथ्यों से मेल नहीं खाते, इसलिए सही उत्तर यही है।"],["नाथद्वारा शैली की मौलिक देन क्या मानी जाती है?",["पिछवाई चित्र","फड़ चित्र","मांडना","कावड़"],0,"नाथद्वारा शैली की मूल देन बड़े कपड़े पर बनी पिछवाई चित्र हैं, जो श्रीनाथजी की मूर्ति के पीछे सजावट के लिए टाँगे जाते थे। फड़ और कावड़ लोककलाएँ हैं जिनमें कथाएँ चित्रित होती हैं और मांडना दीवारों-आँगन की सजावट है, इसलिए वे नाथद्वारा की पहचान नहीं हैं।"],["राजस्थान में आदिम मानव के शैलचित्र किस स्थान से मिले हैं?",["अलनिया दरा (कोटा)","आमेर","पुष्कर","सरिस्का"],0,"पुस्तक में अलनिया दरा (कोटा), बैराठ (जयपुर) और दर-बराहना (भरतपुर) के शैलाश्रयों के चित्रों को राजस्थान की प्राचीनतम चित्र परंपरा बताया गया है। वी.एस. वाकणकर ने 1953 में चम्बल घाटी, दरा और कालीसिंध घाटी में शैलाश्रय खोजे थे। आमेर, पुष्कर और सरिस्का इस संदर्भ में नहीं आते।"],["1060 ई. के सचित्र ग्रंथ ‘ओघ निर्युक्ति वृत्ति’ और ‘दस वैकालिक सूत्र चूर्णि’ कहाँ संरक्षित हैं?",["जैसलमेर के ग्रंथ भंडार में","उदयपुर सिटी पैलेस में","जयपुर के संग्रहालय में","बीकानेर के अभिलेखागार में"],0,"इन दोनों ग्रंथों को सचित्र ग्रंथ का सबसे पुराना उपलब्ध उदाहरण माना गया है और ये जैसलमेर के संग्रह में संरक्षित हैं। उदयपुर, जयपुर और बीकानेर में कला से जुड़े संग्रह हैं, पर इन दो ग्रंथों का संरक्षण स्थान पुस्तक में जैसलमेर बताया गया है।"],["जहाँ अन्य विद्वान इसे ‘राजपूत चित्रकला’ कहते थे, वहाँ किसने इसे ‘राजस्थानी चित्रकला’ नाम दिया?",["रायकृष्ण दास","आनंद कुमार स्वामी","हैवेल","डब्ल्यू.एच. ब्राउन"],0,"कुमार स्वामी, ओ.सी. गांगुली और हैवेल ने इसे ‘राजपूत चित्रकला’ कहा, और डब्ल्यू.एच. ब्राउन ने इसे ‘राजपूत आर्ट’ कहा। रायकृष्ण दास ने इस नामकरण का खंडन कर इसे ‘राजस्थानी चित्रकला’ नाम दिया, इसलिए सही उत्तर वही है। बाकी विकल्प पुस्तक में दिए गए तथ्यों से मेल नहीं खाते, इसलिए सही उत्तर यही है।"],["मेवाड़ शैली का सबसे प्रारंभिक उदाहरण कौन-सा सचित्र ग्रंथ माना गया है?",["श्रावकप्रतिक्रमणसूत्रचूर्णि (1260 ई.)","सुपासनाह चरियम (1423 ई.)","रागमाला (1605 ई.)","ढोला-मारू (1592 ई.)"],0,"1260 ई. का श्रावकप्रतिक्रमणसूत्रचूर्णि महाराणा तेजसिंह के काल में बना और मेवाड़ शैली का सबसे पुराना उदाहरण माना गया है। सुपासनाह चरियम 1423 में देलवाड़ा में, ढोला-मारू 1592 में और रागमाला 1605 में बनी, इसलिए वे बाद के उदाहरण हैं। बाकी विकल्प पुस्तक में दिए गए तथ्यों से मेल नहीं खाते, इसलिए सही उत्तर यही है।"],["महाराणा प्रताप के काल में चित्रकला किस स्थान पर विकसित हुई और उसकी प्रसिद्ध कृति कौन-सी है?",["चावंड; ढोला-मारू (1592)","उदयपुर; रागमाला (1605)","गोगुंदा; गीतगोविंद","कुंभलगढ़; भागवत"],0,"प्रताप के काल में चित्रकला उनकी राजधानी पहला कथन गलत है। बाकी तीनों कथन पुस्तक के अनुसार सही हैं। पुस्तक में बताई गई चारों बातों में केवल पहली बात तकनीक की परिभाषा के विरुद्ध है।"],["लोक कलाओं से संबंधित कौन-सा युग्म सही सुमेलित नहीं है?",["गोडलिया – कपड़े की रंगाई-छपाई","फड़ – जोशी परिवार (शाहपुरा)","कावड़ – बस्सी (चित्तौड़गढ़)","मेहंदी – सोजत और मालवा (मारवाड़)"],0,"गोडलिया पशुओं को दागने से बना पहचान चिह्न है, इसकी प्रक्रिया को आतेरणा कहते हैं, इसलिए इसे कपड़े की रंगाई-छपाई बताना गलत है। फड़ शाहपुरा के जोशी परिवारों की, कावड़ बस्सी की और सोजत-मालवा की मेहंदी मारवाड़ में प्रसिद्ध है, इसलिए ये युग्म सही हैं।"],["जयपुर चित्रकला के शासकों का सही कालक्रम (प्राचीन से नवीन) कौन-सा है?",["मिर्जा राजा जयसिंह, सवाई जयसिंह, ईश्वरीसिंह, माधोसिंह प्रथम, प्रतापसिंह, रामसिंह","सवाई जयसिंह, मिर्जा राजा जयसिंह, माधोसिंह, ईश्वरीसिंह, रामसिंह, प्रतापसिंह","रामसिंह, प्रतापसिंह, माधोसिंह, ईश्वरीसिंह, सवाई जयसिंह, मिर्जा राजा जयसिंह","ईश्वरीसिंह, माधोसिंह, मिर्जा राजा जयसिंह, सवाई जयसिंह, प्रतापसिंह, रामसिंह"],0,"मिर्जा राजा जयसिंह (1621-67) के बाद सवाई जयसिंह, फिर ईश्वरीसिंह, माधोसिंह प्रथम, प्रतापसिंह और अंत में रामसिंह (जिन्होंने 1857 में आर्ट स्कूल बनाया) का क्रम है। अन्य विकल्पों में कम से कम एक शासक गलत स्थान पर रखा गया है। इसी क्रम में ईश्वरीसिंह ने सूरतखाना जयपुर स्थानांतरित किया और रामसिंह ने 1857 में आर्ट स्कूल बनवाया।"]]},{"id":211,"t":"Chapter 6 · स्थापत्य एवं शिल्प · Part-1","s":"RBSE कक्षा 10 · राजस्थान का इतिहास एवं कला संस्कृति","min":60,"cat":"rbse","sub":{"rbse":"c10"},"qs":[["जयपुर की रूपरेखा (नौ चौकड़ियों की ग्रिड) किस वास्तुकार ने बनाई?",["विद्याधर","मंडन","जगन्नाथ सम्राट","सवाई जयसिंह"],0,"पुस्तक के अनुसार प्रसिद्ध वास्तुकार विद्याधर ने जयपुर को नौ खंडों की ग्रिड पर बसाया। नवंबर 1727 में नींव राजगुरु पंडित जगन्नाथ सम्राट ने रखी और सपना सवाई जयसिंह का था।\n✅ विद्याधर — उसने नौ खंडों की ग्रिड पर जयपुर रचा\n❌ मंडन — कुंभलगढ़ का मुख्य शिल्पी था\n❌ जगन्नाथ सम्राट — राजगुरु थे, जिन्होंने नींव रखी\n❌ सवाई जयसिंह — नगर के संस्थापक थे, नक्शाकार नहीं"],["यूनेस्को ने 2013 में राजस्थान के कितने किलों को विश्व धरोहर सूची में शामिल किया?",["6","4","8","3"],0,"2013 में फ्नोम पेन्ह की विश्व धरोहर समिति बैठक में राजस्थान के 6 प्रमुख किले सूची में आए। इसलिए छह ही सही संख्या है और बाकी संख्याएँ पुस्तक से मेल नहीं खातीं।\n✅ 6 — आमेर, गागरोन, कुंभलगढ़, जैसलमेर, रणथंभौर, चित्तौड़गढ़\n❌ 4 — संख्या पुस्तक की सूची से कम है\n❌ 8 — संख्या पुस्तक की सूची से अधिक है\n❌ 3 — संख्या पुस्तक की सूची से कम है"],["चित्तौड़गढ़ दुर्ग किस पठार पर स्थित है?",["मेसा का पठार","मालवा का पठार","वागड़ का पठार","उपरमाल का पठार"],0,"चित्तौड़गढ़ दुर्ग मेसा के पठार पर स्थित है, इसलिए इसे किलों का मुकुट माना जाता है। कहावत है ‘गढ़ तो चित्तौड़गढ़, बाकी सब गढ़ैया’। दिल्ली से मालवा-गुजरात के रास्ते पर होने से इसका सामरिक महत्व था।\n✅ मेसा का पठार — पुस्तक में यही पठार बताया गया है\n❌ मालवा का पठार — यह किले के रास्ते वाले क्षेत्र से जुड़ा है, पठार नहीं\n❌ वागड़ का पठार — पुस्तक में किले के पठार के रूप में नहीं है\n❌ उपरमाल का पठार — पुस्तक में किले के पठार के रूप में नहीं है"],["कुंभलगढ़ दुर्ग का मुख्य वास्तुकार कौन था?",["मंडन","विद्याधर","कुम्भा","वस्तुपाल"],0,"कुंभलगढ़ महाराणा कुम्भा ने बनवाया और इसका मुख्य वास्तुकार मंडन था। यह गिरि दुर्ग का उत्कृष्ट उदाहरण है, जो मेवाड़ और मारवाड़ की सीमा पर सादड़ी गाँव के पास है।\n✅ मंडन — कुम्भा के दरबारी शिल्पी, कुंभलगढ़ के वास्तुकार\n❌ विद्याधर — जयपुर नगर के वास्तुकार थे\n❌ कुम्भा — निर्माता राजा थे, मुख्य शिल्पी नहीं\n❌ वस्तुपाल — दिलवाड़ा के लूणा वसही से जुड़े मंत्री हैं"],["किस किले को ‘सुदर्शनगढ़’ भी कहा जाता है?",["नाहरगढ़ (जयपुर)","तारागढ़ (बूंदी)","आमेर का किला","जयगढ़"],0,"पुस्तक के अनुसार जयपुर के अरावली शिखर पर बना नाहरगढ़ सुदर्शनगढ़ भी कहलाता है। इसका नाम नाहरसिंह भोमिया के नाम पर पड़ा।\n✅ नाहरगढ़ (जयपुर) — सवाई जयसिंह द्वारा बनवाया गया, सुदर्शनगढ़ भी कहलाता है\n❌ तारागढ़ (बूंदी) — तारे जैसा दिखने के कारण तारागढ़ कहलाता है\n❌ आमेर का किला — कछवाहों की पुरानी राजधानी का किला\n❌ जयगढ़ — तोप निर्माण वाला रहस्यमय किला"],["किस किले को ‘राजस्थान का वेल्लोर’ कहा जाता है?",["भैंसरोडगढ़ (चित्तौड़गढ़)","गागरोन","सिवाना","कुंभलगढ़"],0,"भैंसरोडगढ़ चंबल और बामनी नदियों के स ोप निर्माण का कोई कारखाना नहीं था — पुस्तक के अनुसार कारखाना था\n❌ लोहागढ़ का उत्तरी द्वार अष्टधातु का है — पुस्तक के अनुसार सही\n❌ किराडू को राजस्थान का खजुराहो कहा जाता है — पुस्तक के अनुसार सही\n❌ राजसमंद झील की पाल पर नौ चौकी है — पुस्तक के अनुसार सही"],["हवेलियों से संबंधित कौन-सा युग्म सही सुमेलित नहीं है?",["पटवों की हवेली – जोधपुर","सालिमसिंह की हवेली – जैसलमेर","बच्छावतों की हवेली – बीकानेर","रूप निवास हवेली – नवलगढ़"],0,"पटवों की हवेली जैसलमेर की प्रसिद्ध हवेली है, जोधपुर की नहीं। बाकी युग्म सही हैं।\n✅ पटवों की हवेली – जोधपुर — यह जैसलमेर में है\n❌ सालिमसिंह की हवेली – जैसलमेर — पुस्तक के अनुसार सही\n❌ बच्छावतों की हवेली – बीकानेर — पुस्तक के अनुसार सही\n❌ रूप निवास हवेली – नवलगढ़ — पुस्तक के अनुसार सही"],["मंदिर शैलियों के विकास का सही क्रम (प्राचीन से नवीन) कौन-सा है?",["गुर्जर-प्रतिहार, सोलंकी, भूमिज, हवेली मंदिर","सोलंकी, गुर्जर-प्रतिहार, हवेली मंदिर, भूमिज","भूमिज, हवेली मंदिर, गुर्जर-प्रतिहार, सोलंकी","हवेली मंदिर, भूमिज, सोलंकी, गुर्जर-प्रतिहार"],0,"आठवीं सदी में गुर्जर-प्रतिहार, दसवीं-ग्यारहवीं में सोलंकी, ग्यारहवीं के आसपास भूमिज और सोलहवीं सदी के बाद हवेली मंदिर शैली विकसित हुई।\n✅ गुर्जर-प्रतिहार, सोलंकी, भूमिज, हवेली मंदिर — 8वीं सदी से 16वीं के बाद तक\n❌ सोलंकी, गुर्जर-प्रतिहार, हवेली मंदिर, भूमिज — प्रतिहार शैली सबसे पहले की है\n❌ भूमिज, हवेली मंदिर, गुर्जर-प्रतिहार, सोलंकी — क्रम उलटा-पलटा है\n❌ हवेली मंदिर, भूमिज, सोलंकी, गुर्जर-प्रतिहार — यह क्रम नवीन से प्राचीन है"],["निम्नलिखित कथनों को पढ़िए और सही विकल्प चुनिए:\nA. चाँद बावड़ी आभानेरी (बांदीकुई के पास) में स्थित है।\nB. रानीजी की बावड़ी 1699 ई. में बूंदी में बनी।\nC. नौलखा बावड़ी जयपुर में है।",["A और B सही","केवल B सही","A और C सही","A, B और C सही"],0,"नौलखा बावड़ी डूंगरपुर में है, जयपुर में नहीं, और इसे महारावल आस्करण की रानी प्रेमल देवी ने बनवाया था। इसलिए कथन C गलत है।\n✅ A और B सही — A, B, C में से यही कथन पुस्तक के अनुसार सही हैं\n❌ केवल B सही — इसमें B को सही माना गया, जबकि सही कथन A/B हैं\n❌ A और C सही — इसमें A/C को सही माना गया, जबकि सही कथन A/B हैं\n❌ A, B और C सही — इसमें A/B/C को सही माना गया, जबकि सही कथन A/B हैं"]]},{"id":107,"t":"Chapter 7 · लोक संगीत","s":"RBSE कक्षा 10 · राजस्थान का इतिहास एवं कला संस्कृति","min":30,"cat":"rbse","sub":{"rbse":"c10"},"qs":[["लोक संगीत का आधार क्या है?",["लोकगीत","शास्त्रीय राग","केवल वाद्य यंत्र","नृत्य मुद्राएँ"],0,"लोक संगीत का आधार लोकगीत हैं, जो अलग-अलग त्योहारों, संस्कारों और अवसरों पर समूह में गाए जाते हैं। लोक वाद्य इन गीतों की मधुरता बढ़ाते हैं, पर आधार नहीं हैं। शास्त्रीय राग नियमबद्ध होते हैं और सीखने पड़ते हैं, जबकि लोक संगीत भावनाओं की स्वाभाविक अभिव्यक्ति है। नृत्य मुद्राएँ अलग कला हैं। गांधीजी ने लोकगीतों को जनता की भाषा और संस्कृति का संरक्षक कहा था।"],["‘पधारो म्हारे देश’ गीत किस प्रसिद्ध मांड गायिका से जुड़ा है?",["पद्मश्री अल्लाह जिलाई बाई","मीराबाई","गवरी देवी","कोमल कोठारी"],0,"‘पधारो म्हारे देश’ मांड गायन का प्रसिद्ध गीत है, जिसे पद्मश्री अल्लाह जिलाई बाई ने गाया। पुस्तक इसे पर्यटकों को राजस्थान आने का खुला निमंत्रण बताती है। मांड गायन विश्वभर में प्रसिद्ध है। मीराबाई भक्ति कवयित्री हैं, इसलिए उनका इस गीत से संबंध नहीं है। गवरी देवी और कोमल कोठारी के नाम पुस्तक में इस गीत के संदर्भ में नहीं आए। इसलिए पहला विकल्प ही सही है।"],["मेवाड़ में लड़कियों द्वारा दीपावली से पहले गाए जाने वाले गीत को क्या कहा जाता है?",["घड़ल्यो","लोवड़ी","हरनी","जच्चा"],0,"दीपावली से लगभग 15 दिन पहले बच्चे घर-घर जाकर गीत गाते हैं। लड़कों के गीत लोवड़ी या हरनी कहलाते हैं, जबकि लड़कियों के गीत घड़ल्यो कहलाते हैं। यह परंपरा मेवाड़ क्षेत्र में प्रचलित है। इसलिए लड़कियों के लिए सही उत्तर घड़ल्यो है। जच्चा गीत संतान के जन्म पर गाए जाने वाले गीत हैं, इसलिए वह विकल्प बच्चों के इन गीतों से संबंधित नहीं है।"],["संतान के जन्म पर गाए जाने वाले गीत कहलाते हैं?",["जच्चा","जला","घोड़ी","बन्ना-बन्नी"],0,"संतान के जन्म पर गाए जाने वाले गीत जच्चा कहलाते हैं। इनमें होने वाली माँ की प्रशंसा, परिवार के बढ़ने की खुशी और नवजात को आशीर्वाद दिया जाता है। जला गीत वर पक्ष का जानवासा देखने जाती वधू पक्ष की महिलाओं से जुड़े हैं। घोड़ी गीत वर की घुड़चढ़ी के समय गाया जाता है और बन्ना-बन्नी विवाह के बाद प्रेम की भावना दर्शाते हैं। इसलिए जच्चा ही सही है।"],["वर की घुड़चढ़ी के समय कौन-सा गीत गाया जाता है?",["घोड़ी","जच्चा","जला","इंदोणी"],0,"वर की रवानगी या घुड़चढ़ी के समय ‘घोड़ी’ गीत गाया जाता है। विवाह के अवसर पर सगाई, बधावा, चाक-भात, हल्दी, बिंदौली, तोरण और जला जैसे अनेक संस्कारों के गीत गाए जाते हैं, इसलिए हर रस्म का अपना गीत है। जच्चा गीत संतान जन्म के हैं और जला गीत वधू पक्ष की महिलाओं के जानवासा देखने से जुड़े हैं। इंदोणी अलग लोकगीत है, जो वस्तुओं के माध्यम से भाव प्रकट करता है।"],["विवाह के बाद वर-वधू की प्रेम भावना किन गीतों में झलकती है?",["बन्ना-बन्नी","जला","जच्चा","कुरजाँ"],0,"बन्ना-बन्नी गीतों में विवाह के बाद वर-वधू के प्रेम की इच्छा और भावना झलकती है। पुस्तक में विवाह से जुड़े गीतों की लंबी सूची दी गई है और जन्म तथा विवाह के गीत अन्य अवसरों के गीतों से कहीं अधिक हैं। जला गीत जानवासा देखने जाती वधू पक्ष की महिलाओं से जुड़े हैं और जच्चा गीत संतान के जन्म से। कुरजाँ मरु क्षेत्र का प्रसिद्ध गीत है, इसलिए वह भी सही नहीं है।"],["गणगौर का पर्व किस माह में सोलह दिन तक मनाया जाता है?",["चैत्र","फाल्गुन","श्रावण","भाद्रपद"],0,"गणगौर का पर्व चैत्र माह में अविवाहित कन्याओं और विवाहित स्त्रियों द्वारा 16 दिन तक विधि-विधान से मनाया जाता है। पुस्तक में इसका प्रसिद्ध गीत ‘खेलन दो गणगौर’ दिया गया है। फाल्गुन में होली का समय आता है और श्रावण में तीज मनाई जाती है, इसलिए वे इस पर्व का माह नहीं हैं। भाद्रपद का संबंध इस प्रसंग में किसी प्रमुख गीत-पर्व से नहीं दिया गया है। इसलिए चैत्र सही है।"],["होली के समय फाल्गुन में पुरुष समूह कौन-से गीत गाते हैं?",["रसिया, होरी, धमाल","पपैयो, बादली, मोर","जच्चा, घोड़ी, जला","लूर, ओलूँ, हिचकी"],0,"फाल्गुन माह में होली के समय राजस्थान के हर क्षेत्र में पुरुषों की टोलियाँ रसिया, होरी और धमाल जैसे गीत गाती दिखती हैं। फाल्गुन हिंदू पंचांग का अंतिम माह है। पपैयो, बादली और मोर श्रावण से जुड़े ऋतु गीत हैं। जच्चा, घोड़ी और जला विवाह-जन्म के गीत हैं, जबकि लूर, ओळूँ और हिचकी ऐसे गीत हैं जिनमें भाव किसी वस्तु के माध्यम से प्रकट होते हैं।"],["तीज के गीत किस माह की प्राकृतिक सुंदरता का वर्णन करते हैं?",["श्रावण","चैत्र","माघ","फाल्गुन"],0,"तीज के गीतों में श्रावण मास की प्राकृत const DCONS={'क':'k','ख':'kh','ग':'g','घ':'gh','ङ':'n','च':'ch','छ':'ch','ज':'j','झ':'jh','ञ':'n','ट':'t','ठ':'th','ड':'d','ढ':'dh','ण':'n','त':'t','थ':'th','द':'d','ध':'dh','न':'n','प':'p','फ':'f','ब':'b','भ':'bh','म':'m','य':'y','र':'r','ल':'l','ळ':'l','व':'v','श':'sh','ष':'sh','स':'s','ह':'h'},
 DVOW={'अ':'a','आ':'a','इ':'i','ई':'i','उ':'u','ऊ':'u','ऋ':'ri','ए':'e','ऐ':'ai','ओ':'o','औ':'au','ऑ':'o'},
 DMAT={'ा':'a','ि':'i','ी':'i','ु':'u','ू':'u','ृ':'ri','े':'e','ै':'ai','ो':'o','ौ':'au','ॉ':'o','ॅ':'e'};
function rom(x){x=x.replace(/ज्ञ/g,'gy');let o='';const a=[...x];
 for(let i=0;i<a.length;i++){const c=a[i];
  if(DCONS[c]){o+=DCONS[c];const n=a[i+1];if(n==='\u093C')i++;const m=a[i+1];if(m==='्'){i++}else if(DMAT[m]){o+=DMAT[m];i++}else o+='a'}
  else if(DVOW[c])o+=DVOW[c];else if(c==='ं'||c==='ँ')o+='n';else if(c==='ः')o+='h';else if(c==='\u093C'||c==='्'){}else o+=c}
 return o}
function skel(x){return rom(String(x).toLowerCase()).toLowerCase().replace(/sh/g,'s').replace(/ch/g,'c').replace(/(k|g|j|t|d|b|p)h/g,'$1').replace(/z/g,'j').replace(/f/g,'p').replace(/w/g,'v').replace(/q/g,'k').replace(/x/g,'ks').replace(/[aeiouh]/g,'').replace(/(.)\1+/g,'$1')}
const EN2HI={history:'itihas',culture:'sanskriti',art:'kala',chapter:'adhyay',class:'kaksha',folk:'lok',deity:'devta',saint:'sant',music:'sangeet',introduction:'parichay',unification:'ekikaran',freedom:'swatantrata',independence:'swatantrata',movement:'andolan',heritage:'dharohar virasat',tradition:'parampara',bravery:'shaurya',geography:'bhugol',polity:'rajvyavastha rajniti',economy:'arthvyavastha',science:'vigyan',maths:'ganit',math:'ganit',mathematics:'ganit',environment:'paryavaran',question:'prashn',fort:'kila durg',temple:'mandir',painting:'chitrakala',fair:'mela',festival:'tyohar',dance:'nritya',king:'raja naresh',war:'yuddh',battle:'yuddh',society:'samaj',religion:'dharm',literature:'sahitya',language:'bhasha',tourism:'paryatan',architecture:'sthapatya',sculpture:'murtikala',revolt:'vidroh kranti',revolution:'kranti',treaty:'sandhi',constitution:'samvidhan',general:'samanya',knowledge:'gyan',teacher:'shikshak adhyapak',teaching:'shikshan',education:'shiksha',exam:'pariksha',syllabus:'pathyakram',rajasthan:'rajasthan',india:'bharat',ancient:'prachin',medieval:'madhyakalin',modern:'adhunik',village:'gram',city:'nagar shahar',river:'nadi',desert:'registan marusthal',people:'jan lok'};
const _EK=Object.keys(EN2HI).map(en=>[en,skel(en),EN2HI[en].split(' ').map(skel)]);
function qCands(tok){const k=skel(tok),low=tok.toLowerCase(),c=new Set([k]);
 for(const[en,ek,hs]of _EK){if(ek===k||en===low)hs.forEach(h=>c.add(h));else if(hs.includes(k))c.add(ek)}

 if(!t._h){const c=CATS.find(x=>x.id===t.cat);const sb=(t.sub&&SUBS[t.cat]&&SUBS[t.cat].find(x=>x[0]===t.sub[t.cat]))||[];const raw=(t.t+' '+t.s+' '+(c?c.n:'')+' '+(sb[1]||'')).toLowerCase();t._h={raw,sk:(raw.match(_TK)||[]).map(skel).filter(Boolean)}}
 if(t._h.raw.includes(q))return true;
 return (q.match(_TK)||[]).every(tok=>t._h.raw.includes(tok)||qCands(tok).some(k=>k.length>=2?t._h.sk.some(h=>h.startsWith(k)):t._h.sk.some(h=>h===k)))}

async function stuAuth(mode){const em=$('se').value.trim(),pw=$('sp').value,m=$('smsg'),say=t=>{m.textContent=t};
 if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){say('Enter a valid email ID.');return}
 if(pw.length<6){say('Password must be at least 6 characters.');return}
 const p=fbInit();if(!p){say('The service is not available right now.');return}
 say('Please wait...');
 try{const X=await p;if(mode==='up')await X.au.createUserWithEmailAndPassword(X.auth,em,pw);else await X.au.signInWithEmailAndPassword(X.auth,em,pw);toast(mode==='up'?'Account created ✅':'Logged in ✅')}
 catch(e){const c=e.code||'';say(/email-already-in-use/.test(c)?'This email is already registered. Please log in.':/invalid-credential|wrong-password|user-not-found/.test(c)?'Incorrect email or password.':/weak-password/.test(c)?'The password is too weak.':/network/.test(c)?'Please check your internet connection.':'Error: '+(c||e.message))}}

function isDark(){return TH.mode==='dark'||(TH.mode==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)}
function applyTheme(){
 const r=document.documentElement,t=THEMES.find(x=>x.id===TH.color)||THEMES[0],d=isDark();
 r.setAttribute('data-mode',d?'dark':'light');r.setAttribute('data-color',t.id);
 r.style.setProperty('--p',d?t.d:t.l);
 r.style.setProperty('--tint',d?`color-mix(in srgb,${t.d} 22%,#23253F)`:t.t);
 let m=document.querySelector('meta[name=theme-color]');if(!m){m=document.createElement('meta');m.name='theme-color';document.head.appendChild(m)}
 m.content=d?'#15162B':'#F6F8FD';
 document.querySelectorAll('.mbtn').forEach(b=>b.classList.toggle('sel',b.dataset.m===TH.mode));
 document.querySelectorAll('.cbtn').forEach(b=>b.classList.toggle('sel',b.dataset.c===TH.color));
}
function saveTheme(){try{localStorage.setItem('urooj_theme',JSON.stringify(TH))}catch(e){}}

/* ===== Back: har jagah (on-screen + mobile back button) ===== */
function goBack(){
 if(S.menu){menu(false);return true}
 if(S.view==='home'&&S.cat&&S.cat!=='other'&&$('sheetw')){closeSheet();return true}
 switch(S.view){
  case 'test':exit();return true;
  case 'wait':return true;
  case 'result':S.view='home';S.tab='home';render();scrollTo(0,0);return true;
  case 'admin':closeAdmin();return true;
  case 'books':closeBooks();return true;
  case 'other':
   if(S.other==='syllabus'&&S.sg){syllabusSet();return true}
   if(S.other==='papers'&&S.qp&&(S.qp.y||S.qp.g)){qpSet(S.qp.y?S.qp.g:null,null);return true}
   if(S.other){otherBack();return true}
   closeOther();return true}
 if(S.tab!=='home'){tab('home');scrollTo(0,0);return true}
 if(S.q){S.q='';render();return true}
 return false}
function addTabBack(){if(S.view!=='home'||!['tests','perf','profile','about','contact','notif','papers'].includes(S.tab))return;
 const h=document.querySelector('#app .pad > h2');if(!h||h.parentElement.classList.contains('pgh'))return;
 const row=document.createElement('div');row.className='pgh';
 row.innerHTML=`<button class="ib bkback" aria-label="Go back" onclick="goBack()">${svg('<path d="M15 6l-6 6 6 6"/>','currentColor',22)}</button>`;
 h.parentNode.insertBefore(row,h);row.appendChild(h)}
{const _r4=render;render=function(){_r4.apply(this,arguments);addTabBack()}}

<script>
/* Content protection: screenshot ko poori tarah rokna browser/HTML se possible nahi hai.
   Ye layer copy/print/inspect ko mushkil banati hai.
   Asli screenshot-block ke liye app ko Android WebView mein wrap karke FLAG_SECURE lagayein. */
(function(){
 const app=()=>document.getElementById('app');
 let hold=false;
 const hide=()=>{const a=app();a&&a.classList.add('hide')};
 const show=()=>{const a=app();a&&a.classList.remove('hide')};
 document.addEventListener('visibilitychange',()=>document.hidden?hide():show());
 /* FIX: window blur par screen blur hota tha (link/PDF open, dialog, notification bar) aur kabhi wapas saaf nahi hota tha.
    Ab sirf tab chhodne/app background me jane par blur hota hai; touch/focus/timer par turant saaf. */
 window.addEventListener('focus',show);
 ['pointerdown','touchstart','click','scroll','keydown'].forEach(t=>document.addEventListener(t,()=>{if(!document.hidden&&!hold)show()},{passive:true,capture:true}));
 setInterval(()=>{if(!document.hidden&&!hold)show()},1000);
 window.addEventListener('pagehide',hide);window.addEventListener('pageshow',show);
 const ok=e=>/^(INPUT|TEXTAREA)$/.test((e.target||{}).tagName||'');
 ['contextmenu','dragstart'].forEach(t=>document.addEventListener(t,e=>{if(!ok(e))e.preventDefault()}));
 ['copy','cut'].forEach(t=>document.addEventListener(t,e=>{if(!ok(e))e.preventDefault()}));
 document.addEventListener('keydown',e=>{
  const k=(e.key||'').toLowerCase(),c=e.ctrlKey||e.metaKey;
  if(k==='printscreen'){try{navigator.clipboard.writeText('')}catch(x){}hold=true;hide();setTimeout(()=>{hold=false;show()},1500);e.preventDefault()}
  if(k==='f12'||(c&&['p','s','u'].includes(k))||(c&&e.shiftKey&&['i','j','c','s'].includes(k))||(e.metaKey&&e.shiftKey&&['3','4','5'].includes(k)))e.preventDefault();
 });
})();
</script>
